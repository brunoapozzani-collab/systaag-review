# Imports verification proof screenshots (produced by the Playwright run) into proof/ and commits them.
# Trigger: push that changes proof/IMPORT_URL (one public tarball URL + expected md5 on the second line).
name: import-proofs
on:
  push:
    paths: ["proof/IMPORT_URL"]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and extract
        run: |
          set -e
          URL=$(sed -n 1p proof/IMPORT_URL); MD5=$(sed -n 2p proof/IMPORT_URL)
          curl -sSL "$URL" -o /tmp/proof.tgz
          echo "$MD5  /tmp/proof.tgz" | md5sum -c -
          mkdir -p /tmp/x && tar xzf /tmp/proof.tgz -C /tmp/x
          find proof -maxdepth 1 -type f ! -name index.html ! -name IMPORT_URL -delete
          cp -r /tmp/x/proof_opt/. proof/
          (cd proof && ls -1 | grep -v -E '^(index.html|IMPORT_URL|manifest.json)$' | python3 -c 'import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()],indent=1))' > manifest.json)
          ls proof | wc -l
      - name: Commit
        run: |
          git config user.name "systaag-review-bot"
          git config user.email "noreply@github.com"
          git add proof
          git commit -m "proofs from live verification ($(date -u +%Y-%m-%dT%H:%MZ))" || echo "nothing to commit"
          git push
