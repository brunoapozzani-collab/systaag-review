/* ════════════════════════════════════════════════════════════════════════════

var P=(function(){

  function resize(){var r=fitStage();W=canvas.width=Math.max(1,Math.round(r.w));H=canvas.height=Math.max(1,Math.round(r.h));var k=Math.min(1,Math.min(W,H)/560);N=Math.max(120,Math.round(N0*k));CDIST=Math.max(44,Math.round(CD0*Math.max(.55,k)))}
  function ctr(){return {cx:W*.5,cy:H*.5}}
  function scl(){return Math.min(W,H)*(W<768?.34:.44)}
  function proj3d(x3,y3,z3){var cy=Math.cos(rotY),sy=Math.sin(rotY);var xr=x3*cy+z3*sy,zr=-x3*sy+z3*cy;var cx=Math.cos(rotX),sx=Math.sin(rotX);var yr2=y3*cx-zr*sx,zr2=y3*sx+zr*cx;var s=950/(950+zr2*0.28);return {x:xr*s,y:yr2*s,z:zr2}}
  function shapeGlobe(){var c=ctr(),r=scl()*1.05,pts=[],phi=(1+Math.sqrt(5))/2;for(var i=0;i<N;i++){var theta=2*Math.PI*i/phi,ang=Math.acos(1-2*(i+.5)/N);var x3=Math.sin(ang)*Math.cos(theta)*r,y3=Math.cos(ang)*r,z3=Math.sin(ang)*Math.sin(theta)*r;var p=proj3d(x3,y3,z3);pts.push({x:c.cx+p.x,y:c.cy+p.y,x3:x3,y3:y3,z3:z3})}return pts}
  function shapeHelix(){var c=ctr(),r=scl()*0.36,h=scl()*1.55,pts=[];var n1=Math.floor(N*0.40),n2=Math.floor(N*0.40),nb=N-n1-n2;
    for(var i=0;i<n1;i++){var t=i/n1,a=t*Math.PI*4;var x3=Math.cos(a)*r,y3=(t-.5)*h,z3=Math.sin(a)*r;var p=proj3d(x3,y3,z3);pts.push({x:c.cx+p.x,y:c.cy+p.y,x3:x3,y3:y3,z3:z3})}
    for(var i=0;i<n2;i++){var t=i/n2,a=t*Math.PI*4+Math.PI;var x3=Math.cos(a)*r,y3=(t-.5)*h,z3=Math.sin(a)*r;var p=proj3d(x3,y3,z3);pts.push({x:c.cx+p.x,y:c.cy+p.y,x3:x3,y3:y3,z3:z3})}
    for(var i=0;i<nb;i++){var t=i/nb,a=t*Math.PI*4,bt=[0.25,0.5,0.75][i%3];var x3a=Math.cos(a)*r,z3a=Math.sin(a)*r;var x3=x3a+(-x3a-x3a)*bt,z3=z3a+(-z3a-z3a)*bt;var y3=(t-.5)*h;var p=proj3d(x3,y3,z3);pts.push({x:c.cx+p.x,y:c.cy+p.y,x3:x3,y3:y3,z3:z3})}

  function shapeIcosahedron(){var c=ctr(),r=scl()*0.92,pts=[],phi=(1+Math.sqrt(5))/2;
    var raw=[[-1,phi,0],[1,phi,0],[-1,-phi,0],[1,-phi,0],[0,-1,phi],[0,1,phi],[0,-1,-phi],[0,1,-phi],[phi,0,-1],[phi,0,1],[-phi,0,-1],[-phi,0,1]];
    var verts=raw.map(function(v){var l=Math.sqrt(v[0]*v[0]+v[1]*v[1]+v[2]*v[2]);return [v[0]/l*r,v[1]/l*r,v[2]/l*r]});
    var edges=[[0,1],[0,5],[0,7],[0,10],[0,11],[1,5],[1,7],[1,8],[1,9],[2,3],[2,6],[2,10],[2,11],[3,4],[3,6],[3,8],[3,9],[4,5],[4,9],[4,11],[5,9],[5,11],[6,7],[6,8],[6,10],[7,8],[7,10],[8,9],[9,11],[10,11]];
    var pp=Math.ceil(N/edges.length);
    edges.forEach(function(e){var va=verts[e[0]],vb=verts[e[1]];for(var i=0;i<pp&&pts.length<N;i++){var t=i/pp;var x3=va[0]+(vb[0]-va[0])*t,y3=va[1]+(vb[1]-va[1])*t,z3=va[2]+(vb[2]-va[2])*t;var p=proj3d(x3,y3,z3);pts.push({x:c.cx+p.x,y:c.cy+p.y,x3:x3,y3:y3,z3:z3})}});
    while(pts.length<N){var e=edges[Math.floor(Math.random()*edges.length)];var va=verts[e[0]],vb=verts[e[1]],t=Math.random();var x3=va[0]+(vb[0]-va[0])*t,y3=va[1]+(vb[1]-va[1])*t,z3=va[2]+(vb[2]-va[2])*t;var p=proj3d(x3,y3,z3);pts.push({x:c.cx+p.x,y:c.cy+p.y,x3:x3,y3:y3,z3:z3})}
    return pts}
  function shapeScatter(){var pts=[];for(var i=0;i<N;i++)pts.push({x:Math.random()*W,y:Math.random()*H,x3:null,y3:null,z3:null});return pts}
  var sequence=[{fn:shapeGlobe,hold:8000,type:'globe',rx:0.18},{fn:shapeScatter,hold:2200,type:'scatter',rx:0},{fn:shapeHelix,hold:8000,type:'helix',rx:0.12},{fn:shapeScatter,hold:2200,type:'scatter',rx:0},{fn:shapeIcosahedron,hold:8000,type:'ico',rx:0.32},{fn:shapeScatter,hold:2200,type:'scatter',rx:0}];
  function assignTargets(step){IS_3D=(step.type!=='scatter');if(IS_3D){rotY=0;rotX=step.rx}var pts=step.fn().slice().sort(function(){return Math.random()-.5});particles.forEach(function(p,i){var t=pts[i%pts.length];p.tx=t.x;p.ty=t.y;p.x3=t.x3;p.y3=t.y3;p.z3=t.z3;p.pz=0})}
  function explodeFrom(cx,cy){particles.forEach(function(p){var dx=p.x-cx,dy=p.y-cy,d=Math.sqrt(dx*dx+dy*dy)||1,f=Math.random()*4+2;p.vx+=dx/d*f;p.vy+=dy/d*f})}
  function nextStep(){shapeIdx=(shapeIdx+1)%sequence.length;var step=sequence[shapeIdx];if(step.type==='scatter'){var c=ctr();explodeFrom(c.cx,c.cy)}assignTargets(step);timer=setTimeout(nextStep,step.hold)}
  function update(){var c=ctr();if(IS_3D)rotY+=0.0032;particles.forEach(function(p){if(IS_3D&&p.x3!==null){var pr=proj3d(p.x3,p.y3,p.z3);p.tx=c.cx+pr.x;p.ty=c.cy+pr.y;p.pz=pr.z}
    p.vx+=(p.tx-p.x)*0.048;p.vy+=(p.ty-p.y)*0.048;
    if(mouseX!==-9999){var rx=p.x-mouseX,ry=p.y-mouseY,d2=rx*rx+ry*ry;if(d2<MOUSE_R*MOUSE_R){var d=Math.sqrt(d2)||1,f=(MOUSE_R-d)/MOUSE_R*(IS_3D?9:5);p.vx+=rx/d*f;p.vy+=ry/d*f}}
    p.vx*=0.86;p.vy*=0.86;p.x+=p.vx;p.y+=p.vy})}
  function draw(){if(!running)return;ctx.clearRect(0,0,W,H);update();var rgb=pRGB();var CD=IS_3D?CDIST*1.1:CDIST*0.72,CD2=CD*CD;var rs=scl();
    for(var i=0;i<particles.length;i++){var a=particles[i];for(var j=i+1;j<particles.length;j++){var b=particles[j];var dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy;if(d2<CD2){var d=Math.sqrt(d2);var al=0.25*(1-d/CD);
      if(IS_3D&&mouseX!==-9999){var mx=(a.x+b.x)*.5-mouseX,my=(a.y+b.y)*.5-mouseY;var md=Math.sqrt(mx*mx+my*my);if(md<110)al=Math.min(0.90,al+(1-md/110)*0.65)}
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.strokeStyle='rgba('+rgb+','+al.toFixed(3)+')';ctx.lineWidth=IS_3D?0.75:0.55;ctx.stroke()}}}
    particles.forEach(function(p){var sz=p.size,op=p.op;if(IS_3D&&p.x3!==null){var dt=0.5-p.pz/(rs*1.9+1);sz=Math.max(0.4,p.size*(0.65+0.70*dt));op=Math.max(0.28,p.op*(0.60+0.55*dt))}
      ctx.beginPath();ctx.arc(p.x,p.y,sz,0,Math.PI*2);ctx.fillStyle='rgba('+rgb+','+op.toFixed(3)+')';ctx.fill()});
    raf=requestAnimationFrame(draw)}
  function start(){if(running)return;running=true;resize();particles=[];for(var i=0;i<N;i++)particles.push({x:Math.random()*W,y:Math.random()*H,tx:0,ty:0,vx:0,vy:0,x3:null,y3:null,z3:null,pz:0,size:Math.random()*1.5+0.9,op:Math.random()*.28+.65});
    shapeIdx=0;assignTargets(sequence[0]);timer=setTimeout(nextStep,sequence[0].hold);draw()}
  function stop(){running=false;clearTimeout(timer);if(raf)cancelAnimationFrame(raf);raf=null}
  function onResize(){if(!running)return;resize();while(particles.length>N)particles.pop();while(particles.length<N)particles.push({x:Math.random()*W,y:Math.random()*H,tx:0,ty:0,vx:0,vy:0,x3:null,y3:null,z3:null,pz:0,size:Math.random()*1.5+0.9,op:Math.random()*.28+.65});particles.forEach(function(p){p.x=Math.random()*W;p.y=Math.random()*H});clearTimeout(timer);shapeIdx=0;assignTargets(sequence[0]);timer=setTimeout(nextStep,sequence[0].hold)}
  window.addEventListener('resize',onResize);
  function setMouse(cx,cy){var r=canvas.getBoundingClientRect();mouseX=cx-r.left;mouseY=cy-r.top}
  document.addEventListener('mousemove',function(e){setMouse(e.clientX,e.clientY)});
  document.addEventListener('mouseleave',function(){mouseX=mouseY=-9999});
  document.addEventListener('touchmove',function(e){setMouse(e.touches[0].clientX,e.touches[0].clientY)},{passive:true});
  document.addEventListener('touchend',function(){mouseX=mouseY=-9999});
  return {start:start,stop:stop,resize:onResize};
})();

/* ════════════════════════════════════════════════════════════════════════════
   Escamas (hbs) — the live scales with the metallic spotlight that follows the mouse
   ════════════════════════════════════════════════════════════════════════════ */
var HBS=(function(){
  var wrap=document.getElementById('hbs-wrap'),svg=document.getElementById('hbs-svg');var ns='http://www.w3.org/2000/svg';var specG=null,lightGrad=null,built=false;
  function mk(tag,attrs,animDelay){var el=document.createElementNS(ns,tag);Object.keys(attrs).forEach(function(k){el.setAttribute(k,attrs[k])});if(animDelay)el.style.animationDelay=animDelay;return el}
  function f(n){return n.toFixed(2)}
  function build(){while(svg.firstChild)svg.removeChild(svg.firstChild);var W=wrap.offsetWidth,H=wrap.offsetHeight;if(!W||!H)return;svg.setAttribute('viewBox','0 0 '+W+' '+H);
    var defs=document.createElementNS(ns,'defs');
    defs.innerHTML='<linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox"><stop id="hbg-s1" offset="0"/><stop id="hbg-s2" offset="1"/></linearGradient>'+
      '<linearGradient id="hbg2" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox"><stop id="hbg2-s1" offset="0"/><stop id="hbg2-s2" offset="1"/></linearGradient>'+
      '<filter id="hbf" x="-55%" y="-55%" width="210%" height="210%"><feGaussianBlur in="SourceGraphic" stdDeviation="5" result="b"/><feBlend in="SourceGraphic" in2="b" mode="screen"/></filter>'+
      '<radialGradient id="hbs-light-grad" gradientUnits="userSpaceOnUse" cx="'+f(W/2)+'" cy="'+f(H/2)+'" r="145"><stop offset="0%" stop-color="white" stop-opacity="1"/><stop offset="42%" stop-color="white" stop-opacity="0.82"/><stop offset="72%" stop-color="white" stop-opacity="0.28"/><stop offset="100%" stop-color="white" stop-opacity="0"/></radialGradient>'+
      '<mask id="hbs-light-mask"><rect width="'+W+'" height="'+H+'" fill="url(#hbs-light-grad)"/></mask>';
    svg.appendChild(defs);lightGrad=svg.querySelector('#hbs-light-grad');
    var cols=Math.ceil(W/112)+2,rows=Math.ceil(H/94)+2,cW=W/(cols-1),cH=H/(rows-1),kW=cW*0.43,kHt=cH*0.40,kHb=cH*0.57;
    var baseG=document.createElementNS(ns,'g'),glowG=document.createElementNS(ns,'g');glowG.setAttribute('filter','url(#hbf)');glowG.setAttribute('class','hbs-glow-g');
    specG=document.createElementNS(ns,'g');specG.setAttribute('id','hbs-spec-g');specG.setAttribute('mask','url(#hbs-light-mask)');specG.style.mixBlendMode='screen';
    for(var r=0;r<rows;r++){var odd=r%2,nc=cols+odd;for(var c=0;c<nc;c++){var kx=odd?c*cW:(c+0.5)*cW,ky=(r+0.5)*cH;
      var vT=[kx,ky-kHt],vR=[kx+kW,ky-kHt*0.12],vB=[kx,ky+kHb],vL=[kx-kW,ky-kHt*0.12];
      var pts=[vT,vR,vB,vL].map(function(p){return f(p[0])+','+f(p[1])}).join(' ');var fPts=[vT,vR,[kx,ky-kHt*0.44]].map(function(p){return f(p[0])+','+f(p[1])}).join(' ');
      var del=((kx/W)*0.28+(ky/H)*0.18).toFixed(3)+'s';
      baseG.appendChild(mk('polygon',{points:pts,'class':'hbs-poly'},del));baseG.appendChild(mk('polygon',{points:fPts,'class':'hbs-facet'},del));
      [[vT,vR],[vT,vL]].forEach(function(pair){baseG.appendChild(mk('line',{x1:f(pair[0][0]),y1:f(pair[0][1]),x2:f(pair[1][0]),y2:f(pair[1][1]),'class':'hbs-eline'},del))});
      baseG.appendChild(mk('line',{x1:f(vT[0]),y1:f(vT[1]),x2:f(vR[0]),y2:f(vR[1]),'class':'hbs-pline'},del));
      glowG.appendChild(mk('polygon',{points:pts,'class':'hbs-gpoly'}));
      specG.appendChild(mk('polygon',{points:pts,fill:'rgba(215,225,245,.13)',stroke:'rgba(255,255,255,.68)','stroke-width':'.9'}));
      specG.appendChild(mk('polygon',{points:fPts,fill:'rgba(255,255,255,.38)',stroke:'none'}));
      [[vT,vR],[vT,vL]].forEach(function(pair){specG.appendChild(mk('line',{x1:f(pair[0][0]),y1:f(pair[0][1]),x2:f(pair[1][0]),y2:f(pair[1][1]),stroke:'rgba(255,255,255,.97)','stroke-width':'1.2',fill:'none'}))})}}
    svg.appendChild(baseG);svg.appendChild(glowG);svg.appendChild(specG);built=true}
  var rafId=null,spotX=-9999,spotY=-9999;
  function applySpot(){if(lightGrad){lightGrad.setAttribute('cx',spotX.toFixed(1));lightGrad.setAttribute('cy',spotY.toFixed(1))}rafId=null}
  document.addEventListener('mousemove',function(e){if(!built||html.getAttribute('data-bg')!=='s')return;var rect=wrap.getBoundingClientRect();spotX=e.clientX-rect.left;spotY=e.clientY-rect.top;if(specG)specG.classList.add('hbs-lit');if(!rafId)rafId=requestAnimationFrame(applySpot)});
  document.addEventListener('mouseout',function(e){if(!e.relatedTarget&&specG)specG.classList.remove('hbs-lit')});
  if(window.ResizeObserver)new ResizeObserver(function(){if(html.hasAttribute('data-inicio')&&html.getAttribute('data-bg')==='s')build()}).observe(wrap);
  return {build:build};
})();

/* ── background mode (persisted like the live: taag_bg = p | s) ── */
var LS={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
var BTN=document.getElementById('bg-toggle'),ICON=document.getElementById('bg-toggle-icon'),LABEL=document.getElementById('bg-toggle-label');
function renderToggle(){var p=html.getAttribute('data-bg')!=='s';ICON.className=p?'bi bi-hexagon-fill':'bi bi-stars';LABEL.textContent=p?'Escamas':'Partículas';BTN.title=p?'Mudar para escamas':'Mudar para partículas'}
function activate(mode){html.setAttribute('data-bg',mode);LS.set('taag_bg',mode);if(html.hasAttribute('data-inicio')){if(mode==='p'){P.start()}else{P.stop();fitStage();HBS.build()}}renderToggle()}
BTN.addEventListener('click',function(){activate(html.getAttribute('data-bg')==='s'?'p':'s')});
html.setAttribute('data-bg',LS.get('taag_bg')==='s'?'s':'p');renderToggle();

/* ── mount / unmount the stage with the route ── */
function isHome(){var h=location.hash.replace(/^#\/?/,'');return !h||h.split('/')[0]==='home'}
function mount(){if(!isHome()){unmount();return}html.setAttribute('data-inicio','');fitStage();if(html.getAttribute('data-bg')==='s'){P.stop();HBS.build()}else P.start()}
function unmount(){html.removeAttribute('data-inicio');P.stop()}
window.addEventListener('hashchange',function(){setTimeout(mount,0)});
window.addEventListener('resize',function(){if(html.hasAttribute('data-inicio'))fitStage()});

/* ── the new Início screen: hero + greeting, then what the Início already showed ── */
var prevHome=(typeof SCREENS!=='undefined'&&SCREENS.home)||null;
if(typeof SCREENS!=='undefined'){
  SCREENS.home=function(arg){var old='';try{old=prevHome?prevHome(arg):''}catch(e){old=''}
    return '<div class="inicio-wrap">'+
      '<div class="inicio-hero"><img src="'+LOGO_SRC+'" class="inicio-logo" alt="TAAG Life Experience"></div>'+
      '<div class="inicio-greet"><div class="inicio-greet-label">'+saud()+'</div><div class="inicio-greet-name">Olá, '+userName()+' 👋</div></div>'+
      (old?'<div class="inicio-more"><button class="inicio-more-btn" type="button" onclick="window.__inicioMore(this)"><i class="bi bi-grid-1x2"></i> Resumo dos departamentos <i class="bi bi-chevron-down"></i></button></div><div class="inicio-old" hidden>'+old+'</div>':'')+'</div>'};
  window.__inicioMore=function(btn){var w=btn.closest('.inicio-wrap').querySelector('.inicio-old');var open=w.hasAttribute('hidden');if(open)w.removeAttribute('hidden');else w.setAttribute('hidden','');btn.querySelector('.bi-chevron-down,.bi-chevron-up').className='bi '+(open?'bi-chevron-up':'bi-chevron-down');if(open)setTimeout(function(){w.scrollIntoView({behavior:'smooth',block:'start'})},30)};
  if(window.OWNER)delete window.OWNER.home;
}

/* ── topbar: ← → and 🔔 ── */
(function(){var tb=document.querySelector('header.topbar');if(!tb)return;
  var tg=document.getElementById('toggleSub');var nav=document.createElement('div');nav.className='tb-nav';
  nav.innerHTML='<button id="nav-back" title="Página anterior"><i class="bi bi-chevron-left"></i></button><button id="nav-forward" title="Próxima página"><i class="bi bi-chevron-right"></i></button>';
  if(tg&&tg.parentNode===tb)tb.insertBefore(nav,tg.nextSibling);else tb.appendChild(nav);
  nav.querySelector('#nav-back').onclick=function(){history.back()};nav.querySelector('#nav-forward').onclick=function(){history.forward()};
  var th=document.getElementById('btnTheme');var bell=document.createElement('button');bell.className='iconbtn';bell.id='btnBell';bell.title='Notificações';bell.innerHTML='<i class="bi bi-bell-fill"></i><span id="bellN"></span>';
  if(th&&th.parentNode===tb)tb.insertBefore(bell,th);else tb.appendChild(bell);
  var panel=document.getElementById('bellPanel'),list=document.getElementById('bellList'),sub=document.getElementById('bellSub'),badge=document.getElementById('bellN');
  function items(){var out=[];try{var c=(typeof counts==='function')?counts():{};
      if(c.areceber)out.push([c.areceber,'Pedidos a receber','Compras e Estoque · A receber','#/areceber']);
      if(c.prevendas)out.push([c.prevendas,'Propostas em pré-vendas','Comercial · aguardando validação','#/prevendas']);
      if(c.separacao)out.push([c.separacao,'Propostas com unidades a separar','Compras e Estoque · Separação','#/separacao']);
      if(c.creceber)out.push([c.creceber,'Títulos a receber','Financeiro · Contas a receber','#/creceber']);
      if(c.cpagar)out.push([c.cpagar,'Títulos a pagar','Financeiro · Contas a pagar','#/cpagar']);
      if(c.cotacoes)out.push([c.cotacoes,'Cotações abertas','Compras e Estoque · Cotações','#/cotacoes'])}catch(e){}
    return out}
  function refresh(){var it=items();var n=it.reduce(function(a,x){return a+x[0]},0);badge.textContent=n>99?'99+':n;badge.style.display=n?'block':'none';
    sub.textContent=it.length?it.length+' pendências':'';
    list.innerHTML=it.length?it.map(function(x){return '<a class="it" href="'+x[3]+'"><span class="n">'+x[0]+'</span><span class="t">'+x[1]+'<small>'+x[2]+'</small></span><i class="bi bi-chevron-right" style="color:var(--mut);font-size:11px"></i></a>'}).join(''):'<div class="empty">Nenhuma notificação por enquanto.</div>'}
  bell.onclick=function(e){e.stopPropagation();refresh();panel.classList.toggle('open')};
  document.addEventListener('click',function(e){if(!panel.contains(e.target))panel.classList.remove('open')});
  window.addEventListener('hashchange',function(){panel.classList.remove('open');setTimeout(refresh,50)});
  setTimeout(refresh,300);
})();

/* ── T.A.L.I.A. ── */
(function(){var win=document.getElementById('taag-chat-window'),bub=document.getElementById('taag-chat-bubble'),msgs=document.getElementById('fc-messages'),inp=document.getElementById('fc-input');
  document.querySelectorAll('.fc-nome').forEach(function(e){e.textContent=userName()});
  function open(){win.classList.add('open');win.classList.remove('minimized');setTimeout(function(){inp.focus()},120)}
  function toggle(){if(win.classList.contains('open')&&!win.classList.contains('minimized'))win.classList.remove('open');else open()}
  bub.onclick=toggle;document.getElementById('fc-close').onclick=function(e){e.stopPropagation();win.classList.remove('open')};
  document.getElementById('fc-min').onclick=function(e){e.stopPropagation();win.classList.toggle('minimized')};
  document.getElementById('fc-header').onclick=function(){win.classList.toggle('minimized')};
  function add(cls,text){var d=document.createElement('div');d.className='fc-msg '+cls;d.textContent=text;msgs.appendChild(d);msgs.scrollTop=msgs.scrollHeight;return d}
  var REPLIES=['Ainda estou sendo ligada ao protótipo — por enquanto só escuto. Em breve respondo com os dados do SYSTAAG. ✨','Anotado! Quando eu estiver conectada à Base de dados, vou responder isso com números reais.','Boa pergunta. No sistema real eu busco isso em Comercial, Estoque e Financeiro — aqui no protótipo ainda não tenho acesso.'];
  var k=0;function send(){var t=inp.value.trim();if(!t)return;var w=document.getElementById('fc-welcome');if(w)w.remove();add('me',t);inp.value='';inp.style.height='';
    var ty=document.createElement('div');ty.className='fc-typing';ty.textContent='T.A.L.I.A está digitando…';msgs.appendChild(ty);msgs.scrollTop=msgs.scrollHeight;
    setTimeout(function(){ty.remove();add('talia',REPLIES[k++%REPLIES.length])},700+Math.random()*500)}
  document.getElementById('fc-send').onclick=send;
  inp.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
  inp.addEventListener('input',function(){inp.style.height='auto';inp.style.height=Math.min(110,inp.scrollHeight)+'px'});
})();

/* ── go ── */
if(isHome()){try{if(typeof render==='function')render()}catch(e){}}
mount();
})();
