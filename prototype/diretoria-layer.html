<!-- ===================================================================================================
  DIRETORIA layer (prototype v105) — additive, appended before </body>. Nothing above this line changes.
  One tab for the owners: every number on it is READ from the department that owns it (same function,
  same figure as the department screen) and every figure is a door into that screen.
  Blocks: Saúde hoje · 1. Fluxo de caixa (dia + semana) · 2. Lucratividade por venda (fórmula do e-mail
  a Rodolfo/Cesar) · 3. Centros de custo (TAAG · Acústica · Focal · Pós-venda; compartilhados no total)
  · Comercial · Estoque · Operação · Pós-venda · Pessoas (quem se paga) · Metas · Quem vê este painel.
  Access: perfil Diretoria (and TI, the system admin) only; anyone else needs a per-person authorization
  (Usuários › exceções, the same mechanism the rest of the system uses). ids/classes prefixed dir- .
=================================================================================================== -->
<style>
.dir-wrap{--ml:#3483fa;--mlk:#00a650;--mlr:#f23d4f;--mly:#f5a623}
.dir-wrap .card{border-radius:10px;box-shadow:0 1px 2px rgba(0,0,0,.06);border:1px solid var(--bd,#e6e6e6)}
.dir-tabs{display:flex;gap:4px;flex-wrap:wrap;margin:0 0 16px;border-bottom:1px solid var(--bd,#e6e6e6)}
.dir-tabs button{border:none;background:transparent;color:inherit;opacity:.7;padding:9px 12px;font-size:13.5px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.dir-tabs button.on{opacity:1;color:var(--ml);border-bottom-color:var(--ml)}
.dir-sub{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.dir-sub button{border:1px solid var(--bd,#e6e6e6);background:transparent;color:inherit;border-radius:999px;padding:4px 12px;font-size:12px;cursor:pointer}
.dir-sub button.on{background:var(--ml);color:#fff;border-color:var(--ml)}
.dir-hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:18px}
.dir-hero .card{padding:16px 18px;text-decoration:none;color:inherit;display:block}
.dir-hero .lb{font-size:12px;opacity:.7;font-weight:600}
.dir-hero .v{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:6px 0 4px;white-space:nowrap}
.dir-hero .s{font-size:12px;opacity:.7}
.dir-trend{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px}
.dir-trend.up{background:rgba(0,166,80,.12);color:var(--mlk)}.dir-trend.down{background:rgba(242,61,79,.12);color:var(--mlr)}.dir-trend.flat{background:rgba(127,127,127,.12);opacity:.8}
.dir-h{display:flex;justify-content:space-between;align-items:baseline;margin:22px 0 10px}

.dir-h a{font-size:13px;color:var(--ml);text-decoration:none;font-weight:600}
.dir-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.dir-tile{padding:16px 18px;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:box-shadow .15s}
.dir-tile:hover{box-shadow:0 6px 16px rgba(0,0,0,.1)}
.dir-tile .t{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700}
.dir-tile .t i{font-size:16px;color:var(--ml);margin-right:6px}
.dir-tile .big{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1;white-space:nowrap}
.dir-tile .big small{font-size:12px;font-weight:500;opacity:.65;margin-left:6px;letter-spacing:0}
.dir-tile .rows{font-size:12.5px;display:flex;flex-direction:column;gap:3px}

.dir-tile .rows span:last-child{font-weight:600;white-space:nowrap}
.dir-tile .go{font-size:12.5px;color:var(--ml);font-weight:600;margin-top:auto;padding-top:6px}
.dir-alerts{padding:4px 18px}
.dir-alerts .al{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--bd,#e6e6e6);font-size:13.5px;cursor:pointer}
.dir-alerts .al:first-child{border-top:none}
.dir-alerts .al .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:14px;flex:0 0 auto}
.dir-alerts .al .ic.bad{background:rgba(242,61,79,.12);color:var(--mlr)}.dir-alerts .al .ic.warn{background:rgba(245,166,35,.15);color:#b7780c}.dir-alerts .al .ic.ok{background:rgba(0,166,80,.12);color:var(--mlk)}
.dir-alerts .al b{display:block}.dir-alerts .al .sub{font-size:12px}
.dir-alerts .al .arr{margin-left:auto;color:var(--ml);font-weight:700}
.dir-formula{font-size:12.5px;background:rgba(52,131,250,.07);border-left:3px solid var(--ml);border-radius:8px;padding:10px 14px;margin-bottom:14px;line-height:1.55}
.dir-formula b{color:var(--ml)}
.dir-chart{width:100%;height:auto;display:block;overflow:visible}
.dir-chart text{font-size:10.5px;fill:currentColor;opacity:.7}
.dir-chart .ax{stroke:var(--bd,#e6e6e6);stroke-width:1}
.dir-chart .bar{cursor:pointer}
.dir-spark{width:100%;height:38px;display:block}
.dir-tbl td,.dir-tbl th{white-space:nowrap}.dir-tbl td.l{white-space:normal;min-width:160px}
.dir-meta input{width:120px;text-align:right}
.dir-err{border-left:4px solid var(--mlr);background:rgba(242,61,79,.08);padding:10px 14px;border-radius:8px;font-size:12.5px;margin-bottom:12px}
.dir-chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(127,127,127,.12)}
.dir-chip.ok{background:rgba(0,166,80,.12);color:var(--mlk)}.dir-chip.bad{background:rgba(242,61,79,.12);color:var(--mlr)}.dir-chip.warn{background:rgba(245,166,35,.18);color:#9a6b00}
.dir-bullet{height:10px;border-radius:5px;background:rgba(127,127,127,.15);position:relative;overflow:hidden}
.dir-bullet i{position:absolute;left:0;top:0;bottom:0;background:var(--ml);border-radius:5px}
.dir-bullet.ok i{background:var(--mlk)}.dir-bullet.bad i{background:var(--mlr)}
.dir-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:14px}
.dir-k{padding:14px 16px;cursor:pointer;position:relative;min-height:92px;text-decoration:none;color:inherit;display:block}
.dir-k .lb{font-size:11px;opacity:.65;font-weight:700}.dir-k .v{font-size:21px;font-weight:800;line-height:1.15;margin:4px 0 2px;white-space:nowrap;letter-spacing:-.01em}.dir-k .s{font-size:11.5px;opacity:.7}
.dir-k .dot{position:absolute;top:12px;right:12px;width:9px;height:9px;border-radius:50%}
.dir-ok{background:var(--mlk)}.dir-warn{background:var(--mly)}.dir-bad{background:var(--mlr)}.dir-mute{background:#c4c4c4}
@media (max-width:700px){.dir-hero .v{font-size:24px}.dir-tiles{grid-template-columns:1fr}.dir-grid{grid-template-columns:repeat(2,1fr)}.dir-k .v{font-size:16px}.dir-tabs{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch}}
</style>
<script>
(function(){ 'use strict';
/* ───────────────── helpers (local; the host's BRL rounds to R$ integers — the directors see cents) ───────────────── */
var E=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var r2=function(v){return Math.round((+v||0)*100)/100};
var R$=function(v){v=+v||0;return (v<0?'−':'')+'R$ '+Math.abs(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})};
var Rk=function(v){v=+v||0;return (v<0?'−':'')+'R$ '+Math.abs(Math.round(v)).toLocaleString('pt-BR')};var R0=R$;
var P1=function(v){return (isFinite(v)?(v*100):0).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%'};
var N0=function(v){return (+v||0).toLocaleString('pt-BR')};
var dBR=function(d){return d?String(d).slice(8,10)+'/'+String(d).slice(5,7):'—'};
var ymOf=function(d){return String(d||'').slice(0,7)};
var hoje=function(){try{return today()}catch(e){return new Date().toISOString().slice(0,10)}};
var MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
var ymLb=function(m){var y=m.slice(0,4),mm=+m.slice(5,7);return MES[mm-1]+'/'+y.slice(2)};
var pf=function(){try{return PF()||{}}catch(e){return (S.db.params&&S.db.params.fin)||{}}};
var LINHAS=['TAAG','Acústica','Focal','Pós-venda'];
var DIR={ym:null,cx:'dia',obras:'andamento',err:[]};
function safe(nome,fn){try{return fn()}catch(e){console.error('Diretoria ·',nome,e);DIR.err.push(nome+': '+(e&&e.message||e));return null}}
function warnCards(){if(!DIR.err.length)return '';return '<div class="dir-err"><b>Blocos que não puderam ser lidos agora:</b> '+DIR.err.map(E).join(' · ')+'</div>'}

/* ───────────────── 1. navigation: the section, the screen, the names ───────────────── */
(function(){
  var i0=NAV.findIndex(function(s){return s.id==='dir'});if(i0>=0)NAV.splice(i0,1);
  var ih=NAV.findIndex(function(s){return s.id==='home'});
  NAV.splice(ih+1,0,{id:'dir',icon:'bi-speedometer2',label:'Diretoria',items:[['diretoria','Painel da Diretoria']]});
  try{SEC_OF.diretoria='dir';LABEL.diretoria='Painel da Diretoria';if(window.OWNER)OWNER.diretoria='dir'}catch(e){}
  try{if(window.DEPTNOME)DEPTNOME.dir='Diretoria';if(window.DEPTCOR)DEPTCOR.dir='warn';if(typeof RAILNOME!=='undefined')RAILNOME.dir='Diretoria'}catch(e){}
  try{if(window.SCREEN_DEPS)SCREEN_DEPS.diretoria=['lancamentos','obras','propostas','unidades','negociacoes','folha','os']}catch(e){}
})();

/* ───────────────── 2. access: Diretoria (and TI) see it; everyone else needs a per-person authorization ───────────────── */
function perfis(){return (S.db.perfisAcesso||[])}
function sealAccess(){var ch=false;perfis().forEach(function(p){p.regra=p.regra||{dep:{},tela:{}};p.regra.dep=p.regra.dep||{};
  if(p.regra.dep.dir==null){p.regra.dep.dir=(p.id==='diretoria'||p.id==='ti')?3:0;ch=true}});
  if(ch){try{save()}catch(e){}}}
sealAccess();
function podeVer(){try{if(!window.UQ||!UQ.nivel)return true;return UQ.nivel('diretoria')>=1}catch(e){return true}}
function quemVe(){var out=[];try{(S.db.usuarios||[]).forEach(function(u){if(u.ativo===false)return;var n=UQ.nivel('diretoria',u.login);if(n>=1)out.push({u:u,n:n,exc:!!(u.excecoes&&u.excecoes.diretoria!=null)})})}catch(e){}return out}

/* ───────────────── 3. engines — every number read from the department that owns it ───────────────── */
function caixaHoje(){try{if(window.FS&&FS.caixa)return r2(FS.caixa())}catch(e){}return r2(S.db.caixa&&S.db.caixa.saldo||0)}
function fixosMes(){try{return r2(FN.fixosMes())}catch(e){return 0}}
function aReceber(){try{return r2(FN.aReceber())}catch(e){return r2(S.db.lancamentos.filter(function(l){return l.tipo==='receber'&&!l.pago_em}).reduce(function(a,l){return a+l.valor},0))}}
function aPagar(){try{return r2(FN.aPagar())}catch(e){return r2(S.db.lancamentos.filter(function(l){return l.tipo==='pagar'&&!l.pago_em}).reduce(function(a,l){return a+l.valor},0))}}
function folego(){try{var f=FS.folego();return f==null?null:f}catch(e){var b=fixosMes();return b>0?caixaHoje()/b:null}}
/* 1. fluxo de caixa — DIA: the same recipe as FN.semanas13 (Financeiro › Fluxo de caixa), in 1-day buckets.
   overdue titles fall on day 1; fixed costs + payroll are spread per day (FN.fixosMes × 12 / 365). */
function fluxoDiario(n){
  var T=hoje();var start=new Date(T+'T12:00:00');var iso=function(d){return d.toISOString().slice(0,10)};
  var min=+pf().caixaMinimo||0;var fixoDia=fixosMes()*12/365;
  var rec=S.db.lancamentos.filter(function(l){return l.tipo==='receber'&&!l.pago_em});
  var pag=S.db.lancamentos.filter(function(l){return l.tipo==='pagar'&&!l.pago_em&&['fixo','folha'].indexOf(l.origem)<0});
  var saldo=caixaHoje(),out=[];
  for(var i=0;i<n;i++){var d=new Date(start);d.setDate(d.getDate()+i);var k=iso(d);
    var dentro=function(v){return i===0?String(v||'')<=k:String(v||'')===k};
    var ent=r2(rec.filter(function(l){return dentro(l.vencimento)}).reduce(function(a,l){return a+(+l.valor||0)},0));
    var sai=r2(pag.filter(function(l){return dentro(l.vencimento)}).reduce(function(a,l){return a+(+l.valor||0)},0)+fixoDia);
    saldo=r2(saldo+ent-sai);out.push({d:k,entradas:ent,saidas:sai,saldo:saldo,abaixo:saldo<min,vencido:i===0?rec.filter(function(l){return String(l.vencimento||'')<k}).length:0})}
  return out}
function semanas(){try{return FN.semanas13()}catch(e){return []}}
/* 2. lucratividade por venda — FN.obra / FS.obraRow are the engines of Financeiro › Obras. We only regroup the
   same cents into the lines of the e-mail: receita − custo do produto − garantia − despesas da obra. */
function obraRows(){
  var rows=[];(S.db.obras||[]).forEach(function(o){var x=null,r=null;try{x=FS.obraRow(o)}catch(e){}try{r=FN.obra(o)}catch(e){}
    if(!x||!r||!(x.contratado>0))return;
    var av=+r.av||0;var gar=r2(+r.fpvLiq||0);var despesas=r2((+r.moR||0)+(+r.extrasR||0)+(+r.planilha||0)+(+r.frete||0)*av);
    var impCom=r2((+r.imp||0)*av+(+r.comR||0));var produto=r2(+r.equipR||0);var receita=r2(+r.receitaR||0);
    var lucro=r2(receita-produto-gar-despesas-impCom);
    var nome='';try{nome=C.obraNome?C.obraNome(o):(o.nome||o.id)}catch(e){nome=o.nome||o.id}
    rows.push({o:o,x:x,r:r,nome:nome,status:x.status,uni:x.unidade||'',contratado:r2(x.contratado),receita:receita,produto:produto,gar:gar,despesas:despesas,impCom:impCom,lucro:lucro,lucroFin:r2(x.lucroReal),margemPlano:x.margem,margem:receita?lucro/receita:0,av:av,planoLucro:r2(x.lucroPrev)})});
  return rows}
/* 3. centros de custo — FS.dre(mês, unidade) is the DRE engine (Financeiro › DRE). */
function unidades(){try{if(window.FD1&&Array.isArray(FD1.UNIDADES)&&FD1.UNIDADES.length)return FD1.UNIDADES.slice()}catch(e){}return LINHAS.concat(['Corporativo'])}
function dre(m,u){try{return FS.dre(m,u||'')}catch(e){return null}}
function meses(){try{var m=FS.dreMeses();if(m&&m.length)return m}catch(e){}return [ymOf(hoje())]}
/* comercial */
function Mtot(p){try{return +M.total(p)||0}catch(e){try{return +D.propTotal(p.id)||0}catch(_){return 0}}}
function vendidasNoMes(m){return (S.db.propostas||[]).filter(function(p){return ['vendida','em_obra','concluida'].indexOf(p.estado)>=0&&ymOf(p.vendida_em)===m})}
function vendidasNoAno(y){return (S.db.propostas||[]).filter(function(p){return ['vendida','em_obra','concluida'].indexOf(p.estado)>=0&&String(p.vendida_em||'').slice(0,4)===y})}
function metas(){return S.db.metas||{ano:new Date().getFullYear(),empresa:0,consultores:{}}}
/* scrapes: a screen that keeps its engine private is rendered to a string and its KPI cards are read — the
   same string the department sees. Nothing is recomputed here. */
function scrape(k){try{var fn=SCREENS[k];if(typeof fn!=='function')return null;var h=fn();if(typeof h!=='string')return null;return new DOMParser().parseFromString(h,'text/html')}catch(e){console.error('scrape',k,e);return null}}
function kpiFrom(doc,label){if(!doc)return null;var cards=doc.querySelectorAll('.card');for(var i=0;i<cards.length;i++){var c=cards[i];var kids=c.children;if(kids.length<2)continue;var t=(kids[0].textContent||'').trim();if(t.toUpperCase().indexOf(label.toUpperCase())===0)return {v:(kids[1].textContent||'').trim(),s:(kids[2]?kids[2].textContent:'').trim().replace(/\s+/g,' ')}}return null}

/* ───────────────── 4. tiny SVG charts (no library; theme-aware via currentColor / --bd) ───────────────── */
function svgLine(pts,opts){ /* pts: [{x:label,y:number,bad:bool}] */
  opts=opts||{};var W=opts.w||720,H=opts.h||170,L=46,Rr=10,T=12,B=26;var ys=pts.map(function(p){return p.y});var lo=Math.min.apply(null,ys.concat([opts.min!=null?opts.min:0])),hi=Math.max.apply(null,ys.concat([opts.min!=null?opts.min:0]));if(hi===lo){hi=lo+1}
  var sx=function(i){return L+(W-L-Rr)*(pts.length>1?i/(pts.length-1):0)},sy=function(v){return T+(H-T-B)*(1-(v-lo)/(hi-lo))};
  var d=pts.map(function(p,i){return (i?'L':'M')+sx(i).toFixed(1)+' '+sy(p.y).toFixed(1)}).join(' ');
  var area=d+' L'+sx(pts.length-1).toFixed(1)+' '+sy(lo).toFixed(1)+' L'+sx(0).toFixed(1)+' '+sy(lo).toFixed(1)+' Z';
  var ticks=[lo,(lo+hi)/2,hi].map(function(v){return '<text x="'+(L-6)+'" y="'+(sy(v)+3.5).toFixed(1)+'" text-anchor="end">'+E(Rk(v).replace('R$ ',''))+'</text><line class="ax" x1="'+L+'" x2="'+(W-Rr)+'" y1="'+sy(v).toFixed(1)+'" y2="'+sy(v).toFixed(1)+'"/>'}).join('');
  var step=Math.max(1,Math.round(pts.length/8));var xl=pts.map(function(p,i){return (i%step===0||i===pts.length-1)?'<text x="'+sx(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+E(p.x)+'</text>':''}).join('');
  var minLine=opts.min!=null&&opts.min>0?'<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+sy(opts.min).toFixed(1)+'" y2="'+sy(opts.min).toFixed(1)+'" stroke="#dc3545" stroke-dasharray="4 3"/>':'';
  var zero=lo<0?'<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+sy(0).toFixed(1)+'" y2="'+sy(0).toFixed(1)+'" stroke="#dc3545" stroke-width="1.2"/>':'';
  var dots=pts.map(function(p,i){return p.bad?'<circle cx="'+sx(i).toFixed(1)+'" cy="'+sy(p.y).toFixed(1)+'" r="3" fill="#dc3545"><title>'+E(p.x+' · '+R$(p.y))+'</title></circle>':''}).join('');
  return '<svg class="dir-chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="aspect-ratio:'+W+'/'+H+'">'+ticks+'<path d="'+area+'" fill="#0d6efd" opacity=".12"/><path d="'+d+'" fill="none" stroke="#0d6efd" stroke-width="2"/>'+minLine+zero+dots+xl+'</svg>'}
function svgBarsV(items,opts){ /* items: [{x,y,color,href,title}] */
  opts=opts||{};var W=opts.w||720,H=opts.h||170,L=46,Rr=10,T=12,B=26;var ys=items.map(function(p){return p.y});var lo=Math.min.apply(null,ys.concat([0])),hi=Math.max.apply(null,ys.concat([0]));if(hi===lo)hi=lo+1;
  var n=items.length,gw=(W-L-Rr)/n,bw=Math.min(54,gw*.62);var sy=function(v){return T+(H-T-B)*(1-(v-lo)/(hi-lo))};
  var ticks=[lo,(lo+hi)/2,hi].map(function(v){return '<text x="'+(L-6)+'" y="'+(sy(v)+3.5).toFixed(1)+'" text-anchor="end">'+E(Rk(v).replace('R$ ',''))+'</text><line class="ax" x1="'+L+'" x2="'+(W-Rr)+'" y1="'+sy(v).toFixed(1)+'" y2="'+sy(v).toFixed(1)+'"/>'}).join('');
  var bars=items.map(function(p,i){var x=L+gw*i+(gw-bw)/2,y0=sy(0),y1=sy(p.y);var top=Math.min(y0,y1),h=Math.abs(y0-y1);
    return '<g class="bar"'+(p.href?' onclick="location.hash=\''+E(p.href)+'\'"':'')+'><title>'+E(p.title||(p.x+' · '+R$(p.y)))+'</title><rect x="'+x.toFixed(1)+'" y="'+top.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(1,h).toFixed(1)+'" rx="4" fill="'+(p.color||'#0d6efd')+'"/><text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle">'+E(p.x)+'</text><text x="'+(x+bw/2).toFixed(1)+'" y="'+(p.y>=0?top-4:top+h+11).toFixed(1)+'" text-anchor="middle" style="font-weight:700;opacity:.9">'+E(Rk(p.y).replace('R$ ',''))+'</text></g>'}).join('');
  return '<svg class="dir-chart" viewBox="0 0 '+W+' '+H+'" style="aspect-ratio:'+W+'/'+H+'">'+ticks+bars+'</svg>'}
function svgBarsH(items,opts){ /* items: [{x,y(pct 0..1),color,href,title,txt}] — horizontal, one row each */
  opts=opts||{};var W=720,rowH=22,L=opts.L||200,Rr=opts.Rr||70,H=items.length*rowH+8;var hi=Math.max.apply(null,items.map(function(p){return p.y}).concat([opts.max||0.5]));if(!(hi>0))hi=1;

  return H}
