<!-- ===================================================================================================
  PESSOAS & CULTURA / FACILITIES layer (prototype v106) — additive, appended before </body>.
  One rail entry "Pessoas & Cultura" with two groups in the subnav:
    PESSOAS & CULTURA · Visão · Pessoas · Entrada e saída · Treinamentos e certificações · Metas e avaliação · Cultura
    FACILITIES         · Visão · Ativos internos · Empréstimos · Manutenção e escritório · Contratos
  Reads, never duplicates: Base › Pessoas (S.db.pessoas) is the only person record · #/equipe owns perfis de acesso (UQ)
  · Financeiro › RH owns folha/férias/uniformes/docs (links) · Operação › Frota owns vehicles (S.db.veiculos) ·
  Operação › Comunicados owns comunicados (S.db.comunicados) · Compras owns cotações (A.novaCotacao) ·
  Financeiro › Lançamentos owns every R$ (S.db.lancamentos via FC.novoLancamento) · Diretoria › Pessoas owns
  "essa pessoa se paga?" (window.DIR_PESSOAS). Own stores: S.db.pc (people side) and S.db.fac (facilities).
  Gate: Operação › Programação refuses a técnico without the certification the activity requires (reason shown).
  ids/classes prefixed pc- . No existing line of the prototype is changed.
=================================================================================================== -->

function tituloDoContrato(c){var ym=ymOf(hoje());return (S.db.lancamentos||[]).find(function(l){return l.tipo==='pagar'&&!l.pago_em&&((l.origem==='contrato'&&l.origem_id===c.id)||(l.origem==='fixo'&&norm(l.categoria)===norm(c.categoria)))})}
function garantirTitulo(c){if(tituloDoContrato(c))return;var T=hoje();var venc=T.slice(0,8)+String(c.dia).padStart(2,'0');if(venc<T)venc=addD(venc,30);
  try{if(window.FC&&FC.novoLancamento){FC.novoLancamento({tipo:'pagar',origem:'contrato',origem_id:c.id,valor:c.valor,vencimento:venc,categoria:c.categoria,unidade:'Corporativo',sem_obra:true,motivo:'contrato '+c.nome});return}}catch(e){console.warn('FC.novoLancamento',e)}
  try{put('lancamentos',{id:uid('l'),tipo:'pagar',origem:'contrato',origem_id:c.id,valor:c.valor,vencimento:venc,pago_em:null,categoria:c.categoria,unidade:'Corporativo',sem_obra:true},'contrato '+c.nome)}catch(e){}}
try{FAC().contratos.forEach(garantirTitulo)}catch(e){console.error(e)}

/* every R$ spent by Facilities is a título in Financeiro (A pagar · unidade Administrativo) — the DRE reads it from there */
function despesaFacilities(o){ /* o: {valor, data, categoria, descricao, pago, ref} */
  if(!(+o.valor>0))return null;var id=null;
  try{if(window.FC&&FC.novoLancamento){var l=FC.novoLancamento({tipo:'pagar',origem:'facilities',origem_id:o.ref||'',valor:r2(o.valor),vencimento:o.data||hoje(),pago_em:o.pago?(o.data||hoje()):null,categoria:o.categoria||'Facilities',unidade:'Corporativo',sem_obra:true,motivo:o.descricao||'Facilities'});id=l&&l.id||null}}catch(e){console.warn('FC.novoLancamento',e)}
  if(!id){try{id=uid('l');put('lancamentos',{id:id,tipo:'pagar',origem:'facilities',origem_id:o.ref||'',valor:r2(o.valor),vencimento:o.data||hoje(),pago_em:o.pago?(o.data||hoje()):null,categoria:o.categoria||'Facilities',unidade:'Corporativo',sem_obra:true,descricao:o.descricao||''},o.descricao||'Facilities')}catch(e){console.error(e)}}
  return id}

function certsDe(pid){return (PC().certs||[]).filter(function(c){return c.pessoa_id===pid})}
function treino(id){return (PC().treinos||[]).find(function(t){return t.id===id})||{nome:id}}
function certStatus(c){var T=hoje();if(!c.vence_em)return 'ok';var d=diff(c.vence_em,T);return d<0?'vencida':d<=45?'vencendo':'ok'}
function certsVencidas(){return (PC().certs||[]).filter(function(c){return certStatus(c)==='vencida'})}

function temCert(pid,tid){return certsDe(pid).some(function(c){return c.treino_id===tid&&certStatus(c)!=='vencida'})}
function exigidas(a){var out=[];(PC().cert_regras||[]).forEach(function(r){var hit=false;if(r.grupo&&norm(a.grupo)===norm(r.grupo))hit=true;if(r.sub&&new RegExp(r.sub,'i').test((a.subetapa||'')+' '+(a.nome||'')))hit=true;if(hit&&out.indexOf(r.cert)<0)out.push(r.cert)});return out}
