<!-- ===================================================================================================
  USUÁRIOS + MENSAGENS layer (prototype v104) — additive, appended before </body>.
  1. Mensagens: a second floating bubble (left of T.A.L.I.A.) → 340×480 panel: conversas → thread → compor,
     "nova mensagem", busca, não lidas. Seeded with the real conversations of the live SYSTAAG (26/10/2026).
     Messages are stored in S.db.mensagens; switching user (pill) shows the other side of the same thread.
  2. Usuários: #/equipe = faithful clone of the live "Equipe" list (membro · setor/cargo · grupos · ações)
     PLUS a real permission model: PERFIS (role templates) × TELAS (every screen of the live NAV, by department)
     × ação (ver / editar / aprovar), with per-user overrides. Gates bite: a screen the user cannot see leaves
     the rail/subnav and redirects to Início. Audit trail of every change (log 'usuarios').
  3. User pill → the real dropdown (nome, e-mail, Usuários, Sair) + "Entrar como" (prototype-only user switch).
  All ids/classes prefixed um- / uq- . No existing line of the prototype is changed.
=================================================================================================== -->
<style>
/* ── Mensagens ── */

#um-bubble:hover{transform:scale(1.06)}
#um-bubble .um-badge{position:absolute;top:-2px;right:-2px;min-width:18px;height:18px;border-radius:9px;background:#dc3545;color:#fff;font-size:10.5px;font-weight:700;display:none;place-items:center;padding:0 5px;border:2px solid #fff}
#um-win{position:fixed;right:24px;bottom:140px;width:340px;height:480px;max-height:calc(100vh - 160px);border-radius:16px;background:var(--card,#fff);color:var(--tx,#212529);box-shadow:0 20px 60px rgba(0,0,0,.35);display:none;flex-direction:column;overflow:hidden;z-index:10002;border:1px solid var(--bd,#dee2e6)}
#um-win.open{display:flex}
#um-win.max{width:min(720px,calc(100vw - 48px));height:min(640px,calc(100vh - 160px))}

.um-hd{height:48px;background:#1a1d21;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 10px 0 12px;flex:0 0 auto;cursor:pointer}
.um-hd .um-title{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;background:rgba(255,255,255,.08);padding:5px 10px;border-radius:8px}

.um-hd .um-acts button:hover{background:rgba(255,255,255,.22)}
.um-body{flex:1 1 auto;overflow:auto;background:var(--card,#fff)}
.um-conv{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--bd,#eee);cursor:pointer}
.um-conv:hover{background:var(--card-hover,rgba(127,127,127,.06))}
.um-av{width:40px;height:40px;border-radius:50%;flex:0 0 40px;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;background:#0dcaf0;overflow:hidden}
.um-av.g1{background:#0dcaf0}.um-av.g2{background:#6f42c1}.um-av.g3{background:#198754}.um-av.g4{background:#fd7e14}.um-av.g5{background:#0d6efd}.um-av.g6{background:#d63384}
.um-conv .um-c{flex:1 1 auto;min-width:0}
.um-conv .um-n{font-weight:700;font-size:13.5px;display:flex;justify-content:space-between;gap:6px}
.um-conv .um-n small{font-weight:500;color:var(--mut,#6c757d);font-size:11.5px}
.um-conv .um-p{font-size:12.5px;color:var(--mut,#6c757d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.um-conv .um-p.new{color:var(--tx,#212529);font-weight:600}

.um-thread-hd{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--bd,#eee);flex:0 0 auto}
.um-thread-hd button{border:none;background:none;font-size:16px;cursor:pointer;color:inherit}
.um-thread-hd .um-n{font-weight:700;font-size:13.5px;line-height:1.1}.um-thread-hd .um-n small{display:block;font-weight:400;color:var(--mut,#6c757d);font-size:11.5px}

.um-foot button{width:36px;height:36px;border-radius:50%;border:none;background:#0d6efd;color:#fff;cursor:pointer;flex:0 0 36px}
.um-search{padding:8px 12px;border-bottom:1px solid var(--bd,#eee)}
.um-search input{width:100%;border:1px solid var(--bd,#ddd);border-radius:20px;padding:6px 12px;font-size:13px;background:var(--bg,#fff);color:inherit}
.um-empty{padding:40px 16px;text-align:center;color:var(--mut,#6c757d);font-size:13px}
:root[data-theme="dark"] #um-win{background:#1e1e24}
:root[data-theme="dark"] .um-m.them{background:#2a2a32;border-color:#383844}
@media (max-width:700px){#um-win{right:8px;left:8px;width:auto;bottom:130px;height:min(520px,calc(100vh - 150px))}#um-bubble{right:74px;bottom:72px;width:46px;height:46px}}

/* ── Usuários / permissões ── */
.uq-list .uq-row{display:grid;grid-template-columns:minmax(220px,1.3fr) minmax(170px,1fr) minmax(220px,1.6fr) 90px;gap:12px;align-items:center;padding:14px 10px;border-bottom:1px solid var(--bd,#eee)}
.uq-list .uq-row.hd{font-size:10.5px;letter-spacing:.08em;font-weight:700;color:var(--mut,#6c757d);text-transform:uppercase;padding:10px}

.uq-matrix{border-collapse:separate;border-spacing:0;width:100%;font-size:12.5px}
.uq-matrix th,.uq-matrix td{padding:6px 8px;border-bottom:1px solid var(--bd,#eee);vertical-align:middle}
.uq-matrix th{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut,#6c757d);text-align:left;position:sticky;top:0;background:var(--card,#fff);z-index:1}
.uq-matrix .uq-dept td{background:rgba(127,127,127,.07);font-weight:700;font-size:12px;padding:8px}
.uq-matrix .uq-sel{min-width:112px}
.uq-matrix select{font-size:12px;padding:3px 6px;border-radius:7px;border:1px solid var(--bd,#ddd);background:var(--bg,#fff);color:inherit}
.uq-matrix select.v0{color:#adb5bd}.uq-matrix select.v1{color:#6c757d}.uq-matrix select.v2{color:#0d6efd;font-weight:600}.uq-matrix select.v3{color:#198754;font-weight:700}
.uq-matrix .ovr{outline:2px solid rgba(253,126,20,.6);outline-offset:-1px}
.uq-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut,#6c757d)}
.uq-legend b{font-weight:700}
.uq-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.uq-tabs button{border:1px solid var(--bd,#ddd);background:var(--card,#fff);color:inherit;border-radius:20px;padding:6px 14px;font-size:13px;cursor:pointer}
.uq-tabs button.on{background:#0d6efd;color:#fff;border-color:#0d6efd}
.uq-card{background:var(--card,#fff);border:1px solid var(--bd,#eee);border-radius:16px;padding:16px}
.uq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.uq-perfil{border:1px solid var(--bd,#eee);border-radius:14px;padding:14px;cursor:pointer}
.uq-perfil:hover{background:var(--card-hover,rgba(127,127,127,.05))}
.uq-perfil b{font-size:14px}.uq-perfil .sub{font-size:12px}
.uq-perfil .uq-bar{height:6px;border-radius:3px;background:rgba(127,127,127,.15);margin-top:8px;overflow:hidden}
.uq-perfil .uq-bar i{display:block;height:100%;background:#0d6efd}
.uq-form label{font-size:11.5px;letter-spacing:.04em;font-weight:700;color:var(--mut,#6c757d);display:block;margin:10px 0 4px}
.uq-form input,.uq-form select{width:100%;border:1px solid var(--bd,#ddd);border-radius:10px;padding:8px 10px;font-size:13.5px;background:var(--bg,#fff);color:inherit}
.uq-sec{font-size:15px;color:var(--mut,#6c757d);border-bottom:1px solid var(--bd,#eee);padding-bottom:6px;margin:16px 0 4px}
/* user pill dropdown (real SYSTAAG) */
#uq-menu{position:fixed;top:66px;right:14px;z-index:10003;width:300px;background:#1a1d21;color:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.4);padding:14px 0 6px;display:none;border:1px solid rgba(255,255,255,.08)}
#uq-menu.open{display:block}
#uq-menu .uq-who{padding:0 18px 12px;border-bottom:1px solid rgba(255,255,255,.1)}
#uq-menu .uq-who b{display:block;font-size:15px}#uq-menu .uq-who span{font-size:12.5px;color:rgba(255,255,255,.6)}
#uq-menu a,#uq-menu button.uq-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:none;color:#fff;padding:11px 18px;font-size:14px;cursor:pointer;text-decoration:none}
#uq-menu a:hover,#uq-menu button.uq-item:hover{background:rgba(255,255,255,.08)}
#uq-menu .sep{border-top:1px solid rgba(255,255,255,.1);margin:4px 0}
#uq-menu .uq-sair{color:#ff6b6b}
@media (max-width:900px){.uq-list .uq-row{grid-template-columns:1fr 1fr;row-gap:6px}.uq-list .uq-row.hd{display:none}.uq-acts{justify-content:flex-start}}
</style>

<button id="um-bubble" title="Mensagens"><i class="bi bi-chat-dots-fill"></i><span class="um-badge" id="um-badge"></span></button>
<div id="um-win">
  <div class="um-hd" id="um-hd"><div class="um-title"><i class="bi bi-chat-dots-fill"></i> Mensagens <i class="bi bi-box-arrow-up-right" style="font-size:11px;opacity:.7"></i></div>
    <div class="um-acts"><button id="um-new" title="Nova mensagem"><i class="bi bi-pencil-square"></i></button><button id="um-max" title="Expandir"><i class="bi bi-arrows-angle-expand"></i></button><button id="um-min" title="Minimizar"><i class="bi bi-dash-lg"></i></button><button id="um-close" title="Fechar"><i class="bi bi-x-lg"></i></button></div></div>

</div>

<script>
(function(){
'use strict';
var E=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var ini=function(n){return String(n||'?').split(' ').filter(Boolean).map(function(x){return x[0]}).join('').slice(0,2).toUpperCase()};
var color=function(login){var h=0;for(var i=0;i<login.length;i++)h=(h*31+login.charCodeAt(i))&0xffff;return 'g'+(1+h%6)};
var usr=function(login){return (S.db.usuarios||[]).find(function(u){return u.login===login})};
var meLogin=function(){try{return me().login}catch(e){return 'bruno.pozzani'}};
var nowIso=function(){return new Date().toISOString()};
var fmtDay=function(iso){var d=new Date(iso);return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)};
var fmtTime=function(iso){var d=new Date(iso);return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)};
var save_=function(){try{save()}catch(e){}};

/* ───────────────────────── 1. MENSAGENS ───────────────────────── */
(function(){
  if(!S.db.mensagens||!S.db.mensagens.length){
    var y=2026; var T=function(m,d,h,mi){return new Date(y,m-1,d,h||10,mi||0).toISOString()};
    S.db.mensagens=[
      {id:'m1',de:'izaque.ventura',para:'bruno.pozzani',t:'Bruno, o repositório ficou completo? O Robson disse que o commit travou.',ts:T(7,22,9,12),lida:true},
      {id:'m2',de:'bruno.pozzani',para:'izaque.ventura',t:'Travou no push, já resolvi.',ts:T(7,22,9,30),lida:true},
      {id:'m3',de:'izaque.ventura',para:'bruno.pozzani',t:'repositório completo comprometido',ts:T(7,22,9,41),lida:true},
      {id:'m4',de:'catarina.macedo',para:'bruno.pozzani',t:'Vi o protótipo do Financeiro. Quando a tela de Projetos entra?',ts:T(7,22,14,2),lida:true},
      {id:'m5',de:'bruno.pozzani',para:'catarina.macedo',t:'Essa semana. Vai ficar na mesma estrutura do Comercial.',ts:T(7,22,14,10),lida:true},
      {id:'m6',de:'catarina.macedo',para:'bruno.pozzani',t:'vai ser lindo',ts:T(7,22,14,11),lida:true},
      {id:'m7',de:'robson.souza',para:'bruno.pozzani',t:'Quando você conseguir, aprova o equipamento que eu mandei para você, por favor',ts:T(5,19,8,40),lida:true},
      {id:'m8',de:'robson.souza',para:'bruno.pozzani',t:'Um está errado, sem preço, descrição, etc. Esse você excluir é claro',ts:T(5,19,8,41),lida:true},
      {id:'m9',de:'bruno.pozzani',para:'robson.souza',t:'vou aprovar ja',ts:T(5,19,9,2),lida:true},
      {id:'m10',de:'robson.souza',para:'bruno.pozzani',t:'Vlw',ts:T(5,19,9,3),lida:true},
      {id:'m11',de:'bruno.pozzani',para:'yara.moreno',t:'No sininho de notificações, você vê tudo que está pendente para você.',ts:T(5,12,11,20),lida:true},
      {id:'m12',de:'rane.gileade',para:'bruno.pozzani',t:'TA TOP',ts:T(5,11,16,45),lida:true},
      {id:'m13',de:'fabio.brides',para:'bruno.pozzani',t:'Consegue liberar a tela de Programação pro Davi?',ts:T(5,10,10,5),lida:true},
      {id:'m14',de:'thais.andreazzi',para:'bruno.pozzani',t:'Bruno, no Financeiro é "conciliação bancária", não reconciliação. E "a pagar", nunca "a pagares".',ts:T(10,26,15,46),lida:false},
      {id:'m15',de:'guilherme.germanetti',para:'bruno.pozzani',t:'Colocar todas as partes que fala corporativo = administrativo',ts:T(10,26,15,30),lida:false}
    ];
    save_();
  }
  if(typeof TABLES!=='undefined'&&Array.isArray(TABLES)&&TABLES.indexOf('mensagens')<0)TABLES.push('mensagens');
  var win=document.getElementById('um-win'),body=document.getElementById('um-body'),thd=document.getElementById('um-thread-hd'),foot=document.getElementById('um-foot'),inp=document.getElementById('um-input'),badge=document.getElementById('um-badge');
  var view={mode:'list',com:null,q:''};
  var other=function(m){return m.de===meLogin()?m.para:m.de};
  var mine=function(){var L=meLogin();return (S.db.mensagens||[]).filter(function(m){return m.de===L||m.para===L})};
  var convs=function(){var byU={};mine().forEach(function(m){var o=other(m);if(!byU[o]||byU[o].ts<m.ts)byU[o]=m});
    var out=Object.keys(byU).map(function(login){var u=usr(login)||{login:login,nome:login};var unread=mine().filter(function(m){return m.de===login&&!m.lida}).length;return {login:login,nome:u.nome,last:byU[login],unread:unread}});
    (S.db.usuarios||[]).filter(function(u){return u.ativo&&u.login!==meLogin()&&!byU[u.login]}).forEach(function(u){out.push({login:u.login,nome:u.nome,last:null,unread:0})});
    out.sort(function(a,b){return (b.last?b.last.ts:'')>(a.last?a.last.ts:'')?1:-1});return out};
  var unreadTotal=function(){return mine().filter(function(m){return m.para===meLogin()&&!m.lida}).length};
  function paintBadge(){var n=unreadTotal();badge.textContent=n;badge.style.display=n?'grid':'none'}
  function avatar(login,nome){return '<div class="um-av '+color(login)+'">'+E(ini(nome))+'</div>'}
  function renderList(){thd.style.display='none';foot.style.display='none';
    var cs=convs().filter(function(c){return !view.q||(c.nome+' '+c.login).toLowerCase().indexOf(view.q.toLowerCase())>=0});
    body.innerHTML='<div class="um-search"><input id="um-q" placeholder="Buscar pessoa…" value="'+E(view.q)+'"></div>'+(cs.length?cs.map(function(c){var p=c.last?((c.last.de===meLogin()?'Você: ':'')+c.last.t):'<i>Iniciar conversa</i>';
      return '<div class="um-conv" data-login="'+E(c.login)+'">'+avatar(c.login,c.nome)+'<div class="um-c"><div class="um-n"><span>'+E(c.login)+'</span>'+(c.last?'<small>'+fmtDay(c.last.ts)+'</small>':'')+'</div><div class="um-p'+(c.unread?' new':'')+'">'+p+'</div></div>'+(c.unread?'<span class="um-unread"></span>':'')+'</div>'}).join(''):'<div class="um-empty">Nenhuma conversa.</div>');
    var q=document.getElementById('um-q');q.oninput=function(){view.q=q.value;renderList();document.getElementById('um-q').focus();var v=document.getElementById('um-q');v.setSelectionRange(v.value.length,v.value.length)};
    body.querySelectorAll('.um-conv').forEach(function(el){el.onclick=function(){openThread(el.getAttribute('data-login'))}})}
  function openThread(login){view.mode='thread';view.com=login;var u=usr(login)||{login:login,nome:login};
    mine().forEach(function(m){if(m.de===login&&!m.lida)m.lida=true});save_();paintBadge();
    thd.style.display='flex';thd.innerHTML='<button id="um-back" title="Voltar"><i class="bi bi-arrow-left"></i></button>'+avatar(login,u.nome)+'<div class="um-n">'+E(u.nome)+'<small>@'+E(login)+(u.cargo?' · '+E(u.cargo):'')+'</small></div>';
    document.getElementById('um-back').onclick=function(){view.mode='list';renderList()};
    foot.style.display='flex';renderMsgs();setTimeout(function(){inp.focus()},80)}
  function renderMsgs(){var L=meLogin(),ms=mine().filter(function(m){return other(m)===view.com}).sort(function(a,b){return a.ts<b.ts?-1:1});var day='';
    body.innerHTML='<div class="um-msgs">'+(ms.length?ms.map(function(m){var d=fmtDay(m.ts),h='';if(d!==day){day=d;h='<div class="um-day">'+d+'</div>'}return h+'<div class="um-m '+(m.de===L?'me':'them')+'">'+E(m.t)+'<span class="um-t">'+fmtTime(m.ts)+'</span></div>'}).join(''):'<div class="um-empty">Nenhuma mensagem ainda. Diga oi 👋</div>')+'</div>';body.scrollTop=body.scrollHeight}
  function send(){var t=inp.value.trim();if(!t||!view.com)return;S.db.mensagens.push({id:'m'+Date.now().toString(36),de:meLogin(),para:view.com,t:t,ts:nowIso(),lida:false});save_();inp.value='';inp.style.height='';renderMsgs();
    try{log('mensagens',view.com,'mensagem enviada',null,t.slice(0,60))}catch(e){}}

    var m=modal('<h6><i class="bi bi-person-badge me-1"></i>'+(isNew?'Novo membro':'Editar usuário — '+E(u.nome))+'</h6><div class="uq-form"><div class="uq-sec">Informações de acesso</div><div class="row g-2"><div class="col-6"><label>Usuário</label><input id="uqf-login" value="'+E(u.login)+'" '+(isNew?'':'readonly')+'></div><div class="col-6"><label>E-mail</label><input id="uqf-email" value="'+E(u.email||'')+'"></div></div><div class="sub mt-2" style="font-size:11.5px"><i class="bi bi-key me-1"></i>Senha: definida pela própria pessoa no primeiro acesso (link por e-mail). Nunca digitada aqui.</div><div class="uq-sec">Informações de perfil</div><label>Nome completo</label><input id="uqf-nome" value="'+E(u.nome)+'"><div class="row g-2"><div class="col-6"><label>Setor</label><input id="uqf-setor" value="'+E(u.setor||'')+'"></div><div class="col-6"><label>Cargo</label><input id="uqf-cargo" value="'+E(u.cargo||'')+'"></div></div><div class="uq-sec">Acesso</div><label>Perfil de acesso (o que vê e faz em cada tela)</label><select id="uqf-perfil">'+(S.db.perfisAcesso||[]).map(function(p){return '<option value="'+E(p.id)+'"'+(p.id===u.perfil?' selected':'')+'>'+E(p.nome)+' — '+E(p.desc)+'</option>'}).join('')+'</select><label>Grupos (chat e notificações)</label><input id="uqf-grupos" value="'+E((u.grupos||[]).join(', '))+'" placeholder="Comercial, Estoque, …"><div class="sub mt-1" style="font-size:11.5px">Grupos não dão acesso a telas — isso é o perfil + exceções (aba Matriz por tela).</div></div><div class="d-flex justify-content-end gap-2 mt-3"><button class="btn-soft" onclick="this.closest(\'.card\').remove()">Cancelar</button><button class="btn-apple" id="uqf-save">Salvar</button></div>');
    m.style.width='min(640px,94vw)';m.style.maxHeight='90vh';m.style.overflow='auto';
    m.querySelector('#uqf-save').onclick=function(){var g=function(id){return m.querySelector('#'+id).value.trim()};var login=g('uqf-login').toLowerCase().replace(/\s+/g,'.');if(!login||!g('uqf-nome')){toast('Usuário e nome são obrigatórios.',true);return}
      if(isNew){if(usr(login)){toast('Já existe um usuário com este login.',true);return}u={id:'usr_'+Date.now().toString(36),login:login,ativo:true,excecoes:{},fonte:'cadastrado no protótipo'};S.db.usuarios.push(u)}
      u.nome=g('uqf-nome');u.email=g('uqf-email');u.setor=g('uqf-setor');u.cargo=g('uqf-cargo');u.perfil=g('uqf-perfil');u.grupos=g('uqf-grupos').split(',').map(function(x){return x.trim()}).filter(Boolean);
      try{u.papel=(u.perfil==='ti'||u.perfil==='diretoria'||u.perfil==='financeiro')?'gestor':(u.perfil==='gestao'||u.perfil==='prevendas')?'aprovador':'operador'}catch(e){}
      save_();log('usuarios',login,isNew?'criado':'editado',null,u.perfil);m.remove();toast(isNew?'Membro criado':'Usuário salvo');renderMain();try{renderNav()}catch(e){};try{UM.repaint()}catch(e){}}},
  novoPerfil:function(){var nome=prompt('Nome do novo perfil:');if(!nome)return;var id=nome.toLowerCase().replace(/[^a-z0-9]+/g,'_');if(perfil(id)){toast('Já existe.',true);return}S.db.perfisAcesso.push({id:id,nome:nome,desc:'Novo perfil — defina os níveis na matriz.',regra:{dep:{'*':0},tela:{}}});save_();log('perfis',id,'perfil criado');EQ.perfilSel=id;renderMain()}
});

try{LABEL.equipe='Usuários e permissões';SEC_OF.equipe='pes';if(window.OWNER)OWNER.equipe='pes'}catch(e){}

/* ── gates that bite: hide what the user cannot see; redirect if typed by hand ── */
function filtraNav(){try{var u=usr(meLogin());if(!u)return;var rail=document.getElementById('rail'),sn=document.getElementById('subnav');
  if(rail)rail.querySelectorAll('button').forEach(function(b){var m=/#\/([a-z0-9]+)/.exec(b.getAttribute('onclick')||'');if(!m)return;var sec=null;try{sec=SEC_OF[m[1]]}catch(e){}var any=false;try{var S_=NAV.find(function(s){return s.id===sec});if(S_)any=S_.items.some(function(it){return nivel(u,it[0])>=1});else any=nivel(u,m[1])>=1}catch(e){any=true}if(m[1]==='home')any=true;b.style.display=any?'':'none'});
  if(sn)sn.querySelectorAll('a[href^="#/"]').forEach(function(a){var k=a.getAttribute('href').slice(2).split('/')[0];if(k==='finconfig'||k==='home')return;if(nivel(u,k)<1)a.style.display='none';else a.style.display=''})}catch(e){}}
var _rn=window.renderNav;window.renderNav=function(){var r=_rn.apply(this,arguments);filtraNav();try{if(route().k==='equipe'){var sn=document.getElementById('subnav');if(sn)sn.innerHTML='<h6>Pessoas e Cultura</h6>'+[['membros','Membros','bi-people'],['perfis','Perfis de acesso','bi-shield-check'],['matriz','Matriz por tela','bi-grid-3x3'],['auditoria','Auditoria','bi-clock-history']].map(function(t){return '<a href="javascript:void(0)" class="'+(EQ.tab===t[0]?'on':'')+'" onclick="UQ.tab(\''+t[0]+'\')"><i class="bi '+t[2]+' me-1" style="opacity:.7"></i>'+t[1]+'</a>'}).join('');var rail=document.getElementById('rail');if(rail)rail.querySelectorAll('button').forEach(function(b){b.classList.remove('on')})}}catch(e){}return r};
var _rm=window.renderMain;window.renderMain=function(){try{var k=route().k;var u=usr(meLogin());if(u&&k!=='home'&&k!=='equipe'&&typeof SCREENS[k]==='function'&&nivel(u,k)<1){var m=document.getElementById('main');m.innerHTML=head('Sem acesso','Seu perfil <b>'+E((perfil(u.perfil)||{}).nome||u.perfil)+'</b> não tem acesso a <b>'+E(LABEL[k]||k)+'</b>. Peça ao administrador em <a href="#/equipe">Usuários e permissões</a>.')+'<a class="btn-apple" href="#/home">Voltar ao Início</a>';document.title='SYSTAAG · Sem acesso';return}
    if(k==='equipe'){var m2=document.getElementById('main');m2.innerHTML=telaEquipe();document.title='SYSTAAG · Usuários e permissões';return}}catch(e){console.error(e)}
  return _rm.apply(this,arguments)};

/* ── user pill: the real dropdown ── */
(function(){var pill=document.querySelector('.userpill');if(!pill)return;var menu=document.getElementById('uq-menu'),who=document.getElementById('uq-who');var oldSwitch=pill.onclick;
  function paint(){var u=usr(meLogin())||{nome:'Bruno Pozzani',email:'programacao04@taagbrasil.com.br'};who.innerHTML='<b>'+E(u.nome)+'</b><span>'+E(u.email||'')+'</span><div class="sub" style="font-size:11px;color:rgba(255,255,255,.5);margin-top:4px">'+E(u.cargo||'')+' · perfil '+E((perfil(u.perfil)||{}).nome||'')+'</div>'}
  pill.onclick=function(e){e.stopPropagation();paint();menu.classList.toggle('open')};
  document.addEventListener('click',function(e){if(!menu.contains(e.target))menu.classList.remove('open')});
  document.getElementById('uq-switch').onclick=function(){menu.classList.remove('open');if(typeof oldSwitch==='function')oldSwitch.call(pill);setTimeout(function(){try{UM.repaint()}catch(e){}},300)};
  document.getElementById('uq-sair').onclick=function(){menu.classList.remove('open');toast('No sistema real, "Sair" encerra a sessão e volta ao login. No protótipo você continua como '+meLogin()+'.')};
  menu.querySelector('a[href="#/equipe"]').onclick=function(){menu.classList.remove('open')};
  window.addEventListener('hashchange',function(){menu.classList.remove('open');setTimeout(function(){try{UM.repaint()}catch(e){}},50)});
})();
/* repaint messages badge when the user switches (pill → Entrar como) */
(function(){var last=meLogin();setInterval(function(){var l=meLogin();if(l!==last){last=l;try{UM.repaint()}catch(e){};try{renderNav()}catch(e){}}},800)})();
/* cold load on #/equipe: an older alias bounces it to #/dbpessoas during boot — put the person back where they asked */
(function(){var want=(window.__UQ_BOOT_HASH||'');if(/^#\/equipe/.test(want)&&location.hash!==want){location.hash=want;setTimeout(function(){try{render()}catch(e){}},0)}})();
try{renderNav()}catch(e){}
})();
