<title>SYSTAAG</title>
<!--PRECARGA-->
<style>html,body{margin:0;height:100%;background:#f4f5f7;font:600 15px/1.4 "Plus Jakarta Sans",system-ui,-apple-system,sans-serif;color:#1f2430}#ld{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}#ld .w{font:300 44px/1 "Plus Jakarta Sans",system-ui,sans-serif;letter-spacing:.06em}#ld .s{opacity:.6;font-weight:500}#ld .b{width:160px;height:4px;border-radius:999px;background:rgba(0,0,0,.08);overflow:hidden}#ld .b i{display:block;height:100%;width:40%;background:#1f2430;border-radius:999px;animation:ld 1.1s ease-in-out infinite}@keyframes ld{0%{transform:translateX(-100%)}100%{transform:translateX(400%)}}#ld .b i.p{width:100%}@keyframes v196b{from{transform:scaleX(.02)}to{transform:scaleX(.96)}}#ld .n{font-weight:700;font-size:18px;opacity:.85}
/* v195 (21/11/2026): o "Quem é você?" desenhado pela porta de entrada, na hora — mesmo desenho da v166 */
#qv0{position:fixed;inset:0;z-index:5;background:#f5f5f7;overflow:auto;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Plus Jakarta Sans",system-ui,sans-serif;color:#1d1d1f}
#qv0 .qv-in{max-width:980px;margin:0 auto;padding:56px 22px 60px}#qv0 .qv-logo{display:block;height:34px;margin:0 auto 26px;opacity:.9}
#qv0 h1{font-size:2.3rem;font-weight:800;letter-spacing:-.8px;text-align:center;margin:0}#qv0 .qv-sub{text-align:center;color:#6e6e73;margin:6px 0 22px;font-size:15px;font-weight:400}
#qv0 .qv-q{display:block;width:100%;max-width:420px;margin:0 auto 30px;padding:12px 16px;border-radius:14px;border:1px solid #d2d2d7;background:#fff;color:inherit;font-size:16px;outline:none;box-sizing:border-box}#qv0 .qv-q:focus{border-color:#0071e3;box-shadow:0 0 0 4px rgba(0,113,227,.15)}
#qv0 .qv-g{margin-bottom:26px}#qv0 .qv-gh{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6e6e73;margin:0 0 10px 4px}
#qv0 .qv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}

#qv0 .qv-t:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.08)}#qv0 .qv-t:active{transform:scale(.97)}
#qv0 .qv-av{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:19px}#qv0 .qv-n{font-weight:700;font-size:14.5px;line-height:1.2}
#qv0 .qv-none{text-align:center;color:#6e6e73;padding:30px}

<body>
<div id="ld"><div class="w">taag</div><div class="n" id="ld-n"></div><div class="s" id="ld-s">Abrindo o sistema…</div><div class="b"><i id="ld-b"></i></div></div>
<!-- rápido 3 (18/11/2026): o espelho da nuvem começa a trabalhar já, enquanto o sistema ainda baixa (ver nuvem-espelho.js) -->
<script src="nuvem-config.js"></script>
<script src="nuvem-espelho.js"></script>
<script>
/* v169 — A BASE NO ARMAZENAMENTO GRANDE (Bruno, 08-Nov-2026)
   O localStorage do navegador tem um teto duro de ~10 MB — e a base do SYSTAAG só cresce (cada carga nova de dados
   chegava mais perto do teto; o treino, que copia a base, foi o primeiro a bater). Esta página é a porta de entrada:
   ela abre o IndexedDB (centenas de MB, cresce com o disco), carrega a base para a memória e, só então, escreve o
   sistema (app.html) na página. O sistema inteiro continua falando com "localStorage" como sempre — por baixo, toda
   chave systaag_* (e treino:systaag_*) vive na memória + IndexedDB; o resto (tema, fundo…) segue no localStorage normal.
   Segurança: cada gravação vai para o IndexedDB na hora; ao fechar a aba, o que ainda não tiver sido confirmado é
   gravado em síncrono numa cópia de reserva (fb:*) e reaplicado na próxima abertura. Na primeira abertura, a base que
   estava no localStorage é levada para o IndexedDB e só é tirada de lá depois de confirmada. */
(async function(){
'use strict';
var RE=/^(treino:)?systaag_/, FB='fb:', TS='fb:__ts', DBN='systaag_base', ST='kv';
var sp=Storage.prototype, g0=sp.getItem, s0=sp.setItem, r0=sp.removeItem, k0=sp.key, c0=sp.clear, ld=Object.getOwnPropertyDescriptor(sp,'length'), l0=ld&&ld.get;
var LS=window.localStorage;
function realKeys(){var o=[],n=l0.call(LS);for(var i=0;i<n;i++)o.push(k0.call(LS,i));return o}
var APP='app.html'+(location.search?location.search:'');
/* v195: o app.html começa a baixar JÁ (antes esperava a base sair do IndexedDB) */
var appP=fetch(APP,/* rápido 3: publicado com ?v=impressão digital → pode vir do que o navegador já guardou */APP.indexOf('?v=')>0?{}:{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('app.html '+r.status);return r.text()});appP.catch(function(){});
function abreApp(){return appP.then(function(h){try{if(window.__V195)window.__V195.fim()}catch(e){}
  /* document.open() apaga os ouvintes da janela — os nossos entram depois dele */
  document.open();if(window.__BIGSTORE)escuta();
  /* rápido 3b (18/11/2026): com o código já guardado no navegador, o sistema monta-se de uma vez só (5–10 s) e o navegador não
     chegava a desenhar nada — a página ficava BRANCA. Agora a página é escrita em dois tempos: primeiro até a tela
     "Abrindo o sistema…" (marcada no app.html pela publicação), espera o navegador desenhá-la, e só então escreve o resto. */
  var corte=h.indexOf('<!--ABRINDO-->');
  if(corte<0){document.write(h);document.close();return}
  document.write(h.slice(0,corte));
  return new Promise(function(ok){var feito=false,fim=function(){if(feito)return;feito=true;ok()};
    try{requestAnimationFrame(function(){requestAnimationFrame(function(){window.__abrindoPintada=Date.now();fim()})})}catch(e){fim()}
    setTimeout(fim,700)}).then(function(){document.write(h.slice(corte));document.close()})})}

/* ───── v195 — ABRIR JÁ (21/11/2026): a primeira tela aparece na hora ─────
   · ninguém escolhido neste computador → o "Quem é você?" (lista guardada / publicada) — a pessoa escolhe enquanto baixa;
   · já escolhido → "Olá, <nome>" + barra de progresso de verdade (arquivos baixados / total).
   A escolha é gravada em systaag_quem (a mesma chave da v166) ANTES de o sistema arrancar — a v166 entra direto. */
var V=window.__V195=(function(){
  var MIR='qv0:quem',ld=document.getElementById('ld'),esc=null,resolve=null,lista=null,tot=0,ok=0,fim=false;
  var E=function(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
  var norm=function(x){return String(x||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()};
  try{var g=JSON.parse(g0.call(LS,'qv0:lista')||'null');if(g&&Array.isArray(g.lista)&&g.lista.length)lista=g.lista}catch(e){}
  if(!lista&&Array.isArray(window.__QUEM0)&&window.__QUEM0.length)lista=window.__QUEM0;
  var nomeDe=function(l){var n='';(lista||[]).forEach(function(g){g.its.forEach(function(u){if(u.l===l)n=u.n})});return n};
  /* progresso: os arquivos que a porta de entrada mandou baixar + a foto da nuvem */
  var alvo={};[].forEach.call(document.querySelectorAll('link[rel=preload]'),function(l){try{alvo[new URL(l.href,location.href).href]=1;tot++}catch(e){}});
  /* v196: a barra anda pelo TEMPO que este computador costuma levar (mediana das últimas aberturas) — a mesma animação
     continua na tela seguinte (v195-tela.js), sem voltar ao zero */
  var E=12000;try{var tt=JSON.parse(g0.call(LS,'qv0:tempos')||'[]').slice().sort(function(a,b){return a-b});if(tt.length)E=Math.max(2500,tt[Math.floor(tt.length/2)])}catch(e){}
  function pinta(){var b=document.getElementById('ld-b');if(!b||b.__v196)return;b.__v196=1;b.className='p';b.style.cssText='display:block;height:100%;width:100%;transform-origin:0 50%;transform:scaleX(0);animation:v196b '+E+'ms cubic-bezier(.2,.65,.35,1) -'+Math.round(performance.now())+'ms forwards'}
  try{new PerformanceObserver(function(l){l.getEntries().forEach(function(e){if(alvo[e.name]){alvo[e.name]=0;ok++}});pinta()}).observe({type:'resource',buffered:true})}catch(e){}
  function abrindo(l){var n=nomeDe(l),el=document.getElementById('ld-n');if(el)el.textContent=n?'Olá, '+n.split(' ')[0]:'';var s=document.getElementById('ld-s');if(s)s.textContent='Abrindo o seu SYSTAAG…';pinta()}
  function desenha(q){var qn=norm(q),h=(lista||[]).map(function(g){var its=g.its.filter(function(u){return !qn||norm(u.n+' '+u.l).indexOf(qn)>=0});if(!its.length)return '';
      return '<div class="qv-g"><div class="qv-gh">'+E(g.g)+'</div><div class="qv-grid">'+its.map(function(u){return '<button class="qv-t" data-l="'+E(u.l)+'"><span class="qv-av" style="background:'+E(u.c)+'">'+E(u.i)+'</span><span class="qv-n">'+E(u.n)+'</span></button>'}).join('')+'</div></div>'}).join('');
    document.getElementById('qv0-list').innerHTML=h||'<div class="qv-none">Nenhum nome encontrado.</div>'}
  function picker(){var d=document.createElement('div');d.id='qv0';d.setAttribute('role','dialog');d.setAttribute('aria-label','Quem é você?');
    d.innerHTML='<div class="qv-in"><img class="qv-logo" src="taag-wordmark.png" alt="taag" onerror="this.style.display=\'none\'"><h1>Quem é você?</h1><div class="qv-sub">Toque no seu nome para ver o seu SYSTAAG.</div><input class="qv-q" id="qv0-q" placeholder="Buscar seu nome…" autocomplete="off"><div id="qv0-list"></div></div>';
    document.body.appendChild(d);var q=document.getElementById('qv0-q');q.oninput=function(){desenha(q.value)};desenha('');
    d.addEventListener('click',function(ev){var t=ev.target.closest&&ev.target.closest('.qv-t');if(!t)return;var l=t.getAttribute('data-l');esc=l;try{s0.call(LS,MIR,l)}catch(e){}d.remove();abrindo(l);if(resolve)resolve(l)});
    setTimeout(function(){try{q.focus({preventScroll:true})}catch(e){}},60)}
  /* decide já pelo espelho síncrono; quem não tem espelho espera a resposta do IndexedDB (≤ 250 ms) */
  var mir=null;try{mir=g0.call(LS,MIR)}catch(e){}
  if(mir)abrindo(mir);
  return {
    decide:function(quem){/* quem = systaag_quem guardado (ou null) */
      if(quem){try{s0.call(LS,MIR,quem)}catch(e){}abrindo(quem);return Promise.resolve(null)}
      if(!lista){pinta();return Promise.resolve(null)}         /* sem lista: a v166 pergunta depois, como antes */
      picker();return new Promise(function(r){resolve=r})},
    escolhido:function(){return esc},
    fim:function(){fim=true}};
})();

/* ───── IndexedDB ───── */
var db=null;
function open(){return new Promise(function(ok,ko){if(!window.indexedDB)return ko(new Error('sem IndexedDB'));var r=indexedDB.open(DBN,1);r.onupgradeneeded=function(){r.result.createObjectStore(ST)};r.onsuccess=function(){db=r.result;db.onversionchange=function(){try{db.close()}catch(e){}};ok(db)};r.onerror=function(){ko(r.error||new Error('IndexedDB'))};r.onblocked=function(){ko(new Error('IndexedDB bloqueado'))}})}
function lerTudo(){return new Promise(function(ok,ko){var m=new Map(),t=db.transaction(ST),st=t.objectStore(ST),rq=st.openCursor();rq.onsuccess=function(){var c=rq.result;if(c){m.set(String(c.key),c.value);c.continue()}else ok(m)};rq.onerror=function(){ko(rq.error)}})}
function grava(pares,remove){return new Promise(function(ok,ko){var t=db.transaction(ST,'readwrite'),st=t.objectStore(ST);pares.forEach(function(v,k){st.put(v,k)});(remove||[]).forEach(function(k){st.delete(k)});t.oncomplete=function(){ok()};t.onerror=function(){ko(t.error)};t.onabort=function(){ko(t.error||new Error('abort'))}})}

var M=new Map();                  /* a base, em memória: chave → texto */
var pend=new Map(), pendRm=new Set(), agendado=false, falhas=0;
function agenda(){if(agendado)return;agendado=true;setTimeout(flush,0)}
function flush(){agendado=false;if(!pend.size&&!pendRm.size)return;var p=pend,r=pendRm;pend=new Map();pendRm=new Set();
  grava(p,Array.from(r)).then(function(){falhas=0},function(e){falhas++;console.error('v169 gravar no IndexedDB',e);p.forEach(function(v,k){if(!pend.has(k))pend.set(k,v)});r.forEach(function(k){pendRm.add(k)});if(falhas<5)setTimeout(flush,500*falhas);else reserva()})}
/* ao fechar: o que não foi confirmado vai para a reserva síncrona */
function reserva(){try{if(!pend.size&&!pendRm.size)return;pend.forEach(function(v,k){s0.call(LS,FB+k,v)});pendRm.forEach(function(k){s0.call(LS,FB+'rm:'+k,'1')});s0.call(LS,TS,String(Date.now()))}catch(e){console.error('v169 reserva',e)}}
/* "saindo" liga no primeiro sinal de fecho (ouvintes em captura, registados antes dos do sistema) e, enquanto estiver ligado,
   toda gravação da base vai TAMBÉM, em síncrono, para a reserva — assim a gravação de fecho do próprio sistema (v154
   garanteSync, v148 congela…) nunca depende de um IndexedDB que a aba vai matar */
var saindo=false;
function escuta(){['pagehide','beforeunload'].forEach(function(ev){window.addEventListener(ev,function(){saindo=true;reserva()},{capture:true})});
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden'){saindo=true;reserva()}else saindo=false},{capture:true})}

/* ───── o localStorage que o sistema vê ───── */
function instala(){
  sp.getItem=function(k){k=String(k);if(this===LS&&RE.test(k))return M.has(k)?M.get(k):null;return g0.call(this,k)};
  sp.setItem=function(k,v){k=String(k);v=String(v);if(this===LS&&RE.test(k)){M.set(k,v);pend.set(k,v);pendRm.delete(k);if(saindo){try{s0.call(LS,FB+k,v);s0.call(LS,TS,String(Date.now()))}catch(e){console.error('v169 reserva',e)}}agenda();return}return s0.call(this,k,v)};
  sp.removeItem=function(k){k=String(k);if(this===LS&&RE.test(k)){if(M.has(k)){M.delete(k);pend.delete(k);pendRm.add(k);if(saindo){try{r0.call(LS,FB+k);s0.call(LS,FB+'rm:'+k,'1');s0.call(LS,TS,String(Date.now()))}catch(e){}}agenda()}return}return r0.call(this,k)};
  var lista=function(st){var o=[];var n=l0.call(st);for(var i=0;i<n;i++){var kk=k0.call(st,i);if(kk!=null&&!(st===LS&&(RE.test(kk)||kk.indexOf(FB)===0)))o.push(kk)}if(st===LS)M.forEach(function(v,k){o.push(k)});return o};
  sp.key=function(i){var a=lista(this);return i<a.length?a[i]:null};
  Object.defineProperty(sp,'length',{configurable:true,get:function(){return lista(this).length}});
  sp.clear=function(){if(this===LS){Array.from(M.keys()).forEach(function(k){sp.removeItem.call(LS,k)});lista(LS).forEach(function(k){r0.call(LS,k)});return}return c0.call(this)};
  window.__BIGSTORE={tamanho:function(){var t=0;M.forEach(function(v){t+=v.length*2});return t},chaves:function(){return Array.from(M.keys())},pendentes:function(){return pend.size+pendRm.size},db:DBN}}

/* ───── arranque ───── */
var pega1=function(k){return new Promise(function(ok){try{var r=db.transaction(ST).objectStore(ST).get(k);r.onsuccess=function(){ok(r.result==null?null:String(r.result))};r.onerror=function(){ok(null)}}catch(e){ok(null)}})};
var escolha=null;
try{
  await open();
  /* v195: quem está neste computador? (uma leitura só — a base inteira vem a seguir, sem segurar a tela) */
  var q0=await pega1('systaag_quem');if(!q0)try{q0=g0.call(LS,'systaag_quem')}catch(e){}
  escolha=V.decide(q0);
  M=await lerTudo();
  /* 1. primeira vez: a base que está no localStorage sobe para o IndexedDB (e só sai do localStorage depois de confirmada) */
  var velhas=realKeys().filter(function(k){return RE.test(k)});
  if(velhas.length){var sobe=new Map();velhas.forEach(function(k){var v=g0.call(LS,k);if(v!=null&&!M.has(k))sobe.set(k,v)});
    if(sobe.size){await grava(sobe);sobe.forEach(function(v,k){M.set(k,v)})}
    velhas.forEach(function(k){try{r0.call(LS,k)}catch(e){}});
    console.log('v169: '+velhas.length+' chave(s) da base levadas do localStorage para o IndexedDB')}
  /* 2. reserva de um fecho anterior: reaplica */
  var fbs=realKeys().filter(function(k){return k.indexOf(FB)===0&&k!==TS});
  if(fbs.length){var put=new Map(),rm=[];fbs.forEach(function(k){var v=g0.call(LS,k);if(k.indexOf(FB+'rm:')===0)rm.push(k.slice((FB+'rm:').length));else if(v!=null)put.set(k.slice(FB.length),v)});
    await grava(put,rm);put.forEach(function(v,k){M.set(k,v)});rm.forEach(function(k){M.delete(k)});fbs.concat([TS]).forEach(function(k){try{r0.call(LS,k)}catch(e){}});
    console.log('v169: reserva de '+fbs.length+' chave(s) reaplicada')}
  instala();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
}catch(e){
  /* sem IndexedDB (modo privado antigo, bloqueio): o sistema abre como sempre, direto no localStorage */
  console.error('v169: IndexedDB indisponível — a base fica no localStorage',e);
  if(!escolha)try{escolha=V.decide(g0.call(LS,'systaag_quem'))}catch(e2){escolha=null}
}
/* v195: espera a pessoa escolher (o sistema continua a baixar por trás) e grava a escolha na chave da v166 */
try{var lg=await escolha;if(lg){localStorage.setItem('systaag_quem',lg)}}catch(e){console.warn('v195 escolha',e)}
try{await abreApp()}catch(e){document.getElementById('ld').innerHTML='<div class="w">taag</div><div class="s">Não deu para abrir o sistema ('+String(e.message||e).replace(/</g,'&lt;')+'). Recarregue a página.</div>'}
})();
</script>
