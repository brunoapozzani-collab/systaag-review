/* ---------- threads & list ---------- */
function rootsOnScreen(){return comments.filter(function(c){return !c.parentId}).sort(function(a,b){return (a.ts||'').localeCompare(b.ts||'')})}
function numberOf(id){var r=rootsOnScreen();for(var i=0;i<r.length;i++)if(r[i].id===id)return i+1;return '?'}
function chip(s){return '<span class="'+P+'chip" data-s="'+esc(s)+'">'+esc(s)+'</span>'}
function openThread(id){var c=comments.filter(function(x){return x.id===id})[0];if(!c)return;current=c;var reps=comments.filter(function(x){return x.parentId===id});var admin=!!LS.get('token');var el=resolve(c);showHL(el||null,true);
 openPanel(headHtml('#'+numberOf(id)+' · '+(c.whole?'tela inteira':(c.tag||'')+' “'+(c.label||'')+'”'),true)+'<div class="'+P+'body">'+
 '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">'+chip(c.status)+(admin?'<select id="'+P+'status">'+STATUSES.map(function(s){return '<option'+(s===c.status?' selected':'')+'>'+s+'</option>'}).join('')+'</select><button type="button" class="'+P+'ghost" data-act="del">Excluir</button>':'')+'<small style="color:var(--sr-mut)">'+esc(c.type)+' · '+esc(c.screen)+'</small></div>'+
 '<div class="'+P+'msg"><div class="'+P+'who"><b>'+esc(c.author)+'</b><span>'+esc(fmt(c.ts))+'</span></div><div class="'+P+'txt">'+esc(c.text)+'</div>'+(c.crop?'<img class="'+P+'crop" src="'+esc(c.crop)+'" alt="recorte">':'')+'</div>'+
 reps.map(function(r){return '<div class="'+P+'msg"><div class="'+P+'who"><b>'+esc(r.author)+'</b><span>'+esc(fmt(r.ts))+'</span></div><div class="'+P+'txt">'+esc(r.text)+'</div></div>'}).join('')+
 '<label class="'+P+'lbl">Responder</label><input type="text" id="'+P+'name" value="'+esc(LS.get('name')||'')+'" placeholder="Seu nome" maxlength="60"><textarea id="'+P+'text" placeholder="Sua resposta" style="margin-top:6px"></textarea><div class="'+P+'err" id="'+P+'err"></div><button type="button" class="'+P+'send" id="'+P+'reply">Responder</button></div>','thread')}
function reply(){var name=$('name').value.trim(),text=$('text').value.trim(),err=$('err');if(!name){err.textContent='Escreva seu nome.';return}if(!text){err.textContent='Escreva a resposta.';return}LS.set('name',name);var btn=$('reply');btn.disabled=true;
 fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({parentId:current.id,author:name,text:text})}).then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j}})}).then(function(x){if(!x.ok)throw new Error(x.j.error||'erro');comments.push(x.j);openThread(current.id);toast('Resposta enviada ✓')}).catch(function(e){btn.disabled=false;err.textContent=e.message})}
function openList(){var roots=rootsOnScreen();var found=[],lost=[];roots.forEach(function(c){(c.whole||resolve(c)?found:lost).push(c)});var item=function(c){return '<div class="'+P+'item" data-open="'+c.id+'"><span class="'+P+'n">'+numberOf(c.id)+'</span><div><div><b>'+esc(c.author)+'</b> · '+esc(c.type)+' '+chip(c.status)+'</div><div>'+esc(c.text.slice(0,120))+'</div><small>'+esc(c.whole?'tela inteira':(c.tag||'')+' “'+(c.label||'')+'”')+'</small></div></div>'};
 openPanel(headHtml('Comentários desta tela ('+roots.length+')')+'<div class="'+P+'body">'+(roots.length?'':'<div style="color:var(--sr-mut)">Nenhum comentário aqui ainda. Toque em <b>💬 Comentar</b>.</div>')+found.map(item).join('')+(lost.length?'<div class="'+P+'sect">Não encontrei na tela</div>'+lost.map(item).join(''):'')+'</div>','list')}
function fmt(ts){try{var d=new Date(ts);return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}catch(e){return ts||''}}
function adminStatus(c,s){fetch(API+'/'+c.id,{method:'PATCH',headers:{'content-type':'application/json','x-admin-token':LS.get('token')||''},body:JSON.stringify({status:s})}).then(function(r){return r.json()}).then(function(j){if(j.status){c.status=j.status;layoutPins();openThread(c.id);toast('Status: '+j.status)}else toast(j.error||'erro')})}
function adminDelete(c){fetch(API+'/'+c.id,{method:'PATCH',headers:{'content-type':'application/json','x-admin-token':LS.get('token')||''},body:JSON.stringify({delete:true})}).then(function(r){return r.json()}).then(function(j){if(j.deleted){comments=comments.filter(function(x){return x.id!==c.id&&x.parentId!==c.id});closePanel();layoutPins();toast('Excluído')}else toast(j.error||'erro')})}

/* ---------- pins ---------- */
function layoutPins(){pinsL.innerHTML='';var roots=rootsOnScreen();var n=0,shown=0;roots.forEach(function(c){n++;if(c.whole)return;var el=resolve(c);if(!el)return;var r=el.getBoundingClientRect();if(r.bottom<0||r.top>window.innerHeight)return;var p=document.createElement('button');p.type='button';p.className=P+'pin';p.textContent=n;p.title=c.author+': '+c.text.slice(0,80);p.dataset.status=c.status;p.dataset.id=c.id;p.style.left=Math.min(window.innerWidth-14,r.right-6)+'px';p.style.top=Math.max(14,r.top+6)+'px';pinsL.appendChild(p);shown++});$('count').textContent=roots.length?String(roots.length):'';dodgeFab()}
pinsL.addEventListener('click',function(ev){var p=ev.target.closest('.'+P+'pin');if(p)openThread(p.dataset.id)});
function dodgeFab(){fab.style.bottom='';var tries=0;while(tries++<4){var fr=fab.getBoundingClientRect();var hit=null;var cands=document.querySelectorAll('button,a.btn,.btn,.btn-soft,.btn-primary,[onclick]');for(var i=0;i<cands.length;i++){var e=cands[i];if(inOverlay(e))continue;var r=e.getBoundingClientRect();if(!r.width||!r.height)continue;if(r.left<fr.right&&r.right>fr.left&&r.top<fr.bottom&&r.bottom>fr.top){var cs=getComputedStyle(e);if(cs.position==='fixed'||cs.position==='sticky'||r.bottom>window.innerHeight-2){hit=r;break}}}if(!hit)break;var cur=parseFloat(fab.style.bottom)||16;fab.style.bottom=(cur+(fr.bottom-hit.top)+12)+'px'}}
var lastScreen=null;function load(){var s=screenRoute();lastScreen=s;fetch(API+'?screen='+encodeURIComponent(s)).then(function(r){return r.ok?r.json():{comentarios:[]}}).then(function(j){if(screenRoute()!==s)return;comments=j.comentarios||[];layoutPins()}).catch(function(){})}
var relT;function relayout(){clearTimeout(relT);relT=setTimeout(layoutPins,120)}
window.addEventListener('resize',relayout);window.addEventListener('scroll',relayout,true);
window.addEventListener('hashchange',function(){closePanel();if(picking)stopPick();setTimeout(load,150)});
var mo=new MutationObserver(function(ms){for(var i=0;i<ms.length;i++){if(inOverlay(ms[i].target))continue;relayout();return}});mo.observe(document.body,{childList:true,subtree:true});
document.addEventListener('visibilitychange',function(){if(!document.hidden)load()});
load();
if(location.search.indexOf('token=')>=0){try{var tk=new URLSearchParams(location.search).get('token');if(tk)LS.set('token',tk)}catch(e){}}
window.staagRev={reload:load,count:function(){return comments.length},version:'1.0'};
})();
</script>
